id: america-house-kyiv-wednesday-english-chat-with-americans-eng
name:
  uk: America House Kyiv — Wednesday English (Chat with Americans / English with Charlie)
  en: America House Kyiv — Wednesday English (Chat with Americans / English with Charlie)
description:
  uk: >-
    Щотижневий безкоштовний розмовний клуб англійської в America House Kyiv: практикуйте англійську
    з американцями та командою AHK, обговорюйте життя в Америці. У 2024–2025 клуб вів резидент
    програми англійської мови Чарлі.
  en: >-
    Weekly free English speaking club at America House Kyiv: practise English with Americans and the
    AHK team, discuss American life. Led in 2024–2025 by English Language Resident Charlie.
