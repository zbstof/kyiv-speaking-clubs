schedule_note:
  uk: >-
    Розклад не опубліковано. Безкоштовний розмовний клуб з носієм мови входить у курс японської (для
    учнів школи). Деталі — в адміністратора: пн–пт 12:00–19:30, сб 10:00–17:30.
  en: >-
    The schedule has not been published. A free conversation club with a native speaker is included
    in the Japanese course (for the school's students). For details, contact the administrator:
    Mon–Fri 12:00–19:30, Sat 10:00–17:30.
