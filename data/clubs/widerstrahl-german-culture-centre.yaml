  uk:
    name: Розмовні клуби Центру німецької культури «Widerstrahl» (ЦНК «Widerstrahl»)
    description: >-
      Центр німецької культури київських етнічних німців; проводить розмовні клуби німецької мови
      для дітей, дискусійний клуб для дорослих за рівнями, відеоклуби, клуб гідів-перекладачів;
      заняття ведуть носії мови. Також діє клуб вивчення німецької мови «August».
    notes: >-
      На сайті (перевірено 2026-11) зазначено «клуб розмовної практики для дітей, підлітків,
      дорослих»; остання новина на сайті — 2026-10-23. Розкладу клубу на сайті немає. Друга картка
      на osvita (оновлена 2013-08-21, https://osvita.ua/languages/courses/8863/) містить перелік:
      розмовний клуб для дітей, дискусійний клуб для дорослих за рівнями, відеоклуби, клуб
      гідів-перекладачів. Зараз центр працює під назвою Deutsches Haus-Kyjiw (картка на
      education.ua, оновлена 2026-08-26, містить курси, але не клуб). Телефон — загальнодоступний
      номер адміністрації центру.
