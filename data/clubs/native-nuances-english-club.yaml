    uk: Set Coffee Hub
    en: Set Coffee Hub
  address:
    uk: вул. Волоська, 33
    en: 33 Voloska St
  metro:
    uk: Контрактова площа
    en: Kontraktova Ploshcha
  lat: 50.471008
  lon: 30.512996
  geocoded: true
schedule:
  - day: sat
    time: "14:00"
    duration_min: 120
    frequency: weekly
    format: offline
schedule_note:
  uk: >-
    Сезонно: навесні 2026 щосуботи (18 квітня – 30 травня), час змінювався від 13:00 до 17:00; у
    2025 — по неділях 14:00–16:00. Зустріч 6 червня 2026 скасували, відтоді нових анонсів немає. Щоб
    прийти, напишіть «+» під анонсом у чаті. Вхід вільний; замовте принаймні напій або перекус.
  en: >-
    Seasonal: in spring 2026, every Saturday (18 April – 30 May), with times varying from 13:00 to
    17:00; in 2025, on Sundays 14:00–16:00. The meeting on 6 June 2026 was cancelled, and there have
    been no new announcements since. To attend, reply with "+" under the announcement in the chat.
    Free entry; order at least a drink or a snack.
