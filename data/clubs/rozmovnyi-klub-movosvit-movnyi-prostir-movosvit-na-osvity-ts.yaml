notes:
  uk: >-
    Зазначений в обох бібліотечних переліках Департаменту культури Києва (2023-08-17 і 2025-12-01).
    Час зустрічей у переліках не вказано. Район визначено за адресою, не перевірено. 2023:
    «Розмовний клуб для дорослих «У суботу о 12-тій»», а також групові та індивідуальні заняття.
    2025: клуб «Мовосвіт» у партнерстві з «Єдині»; поглиблені та базові курси української для
    дорослих, курси для підлітків, підготовка до НМТ онлайн, дитячі групи у форматі розмовного
    клубу. Телеграм-канал @movosvit.
  en: >-
    Listed in both Kyiv culture-department library lists (2023-08-17 and 2025-12-01). The lists give
    no meeting times. District inferred from the address, not verified. 2023: "Speaking club for
    adults \"U subotu o 12-tii\"" plus group and individual lessons. 2025: club "Movosvit" in
    partnership with "Yedyni"; advanced and basic Ukrainian courses for adults, teen courses, NMT
    prep online, children's groups in speaking-club format. Telegram channel @movosvit.
