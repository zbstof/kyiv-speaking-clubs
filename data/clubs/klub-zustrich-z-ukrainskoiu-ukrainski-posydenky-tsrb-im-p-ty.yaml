notes:
  uk: >-
    Згадується в обох переліках бібліотек Департаменту культури Києва (2023-08-17 і 2025-12-01). Час
    зустрічей у переліках не вказано. Район визначено за адресою, але не перевірено. Перелік 2023
    року: «Розмовний клуб української мови». У конференційній статті за вересень 2023 року клуб
    названо «Українські посиденьки»; його заснувала поетеса й волонтерка Олена Татянченко. Перелік
    за грудень 2025 року: «Зустріч з українською».
  en: >-
    Listed in both Kyiv culture-department library lists (2023-08-17 and 2025-12-01). The lists give
    no meeting times. District inferred from the address, not verified. 2023 list: "Ukrainian
    conversation club". A Sept 2023 conference paper names the club "Ukrainski posydenky", founded
    by poet and volunteer Olena Tatianchenko. Dec 2025 list: "Zustrich z ukrainskoiu".
