id: rozmovnyi-klub-mova-dnk-natsii-ta-kursy-mova-vilnykh-liudei
name:
  uk: Розмовний клуб «Мова. ДНК нації» та курси «Мова вільних людей» (бібліотека ім. І. Шамо)
  en: Conversation club "Mova. DNK natsii" and "Mova vilnykh liudei" courses (I. Shamo Library)
description:
  uk: >-
    Безкоштовний розмовний клуб української мови в публічній бібліотеці Києва для тих, хто
    переходить на українську або вдосконалює її.
  en: >-
    Free Ukrainian conversation club at a Kyiv public library, for people switching to Ukrainian or
    improving it.
languages:
  - uk
format: offline
