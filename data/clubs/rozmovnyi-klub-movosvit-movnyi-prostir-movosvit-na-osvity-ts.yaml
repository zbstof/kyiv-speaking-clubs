  uk: >-
    Безплатний розмовний клуб української мови в публічній бібліотеці Києва для тих, хто переходить
    на українську або вдосконалює її.
  en: >-
    Free Ukrainian conversation club at a Kyiv public library, for people switching to Ukrainian or
    improving it.
