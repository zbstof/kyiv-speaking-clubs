id: institut-francais-dukraine-rozmovni-zustrichi-conversation-m
name: "Institut français d'Ukraine: Розмовні зустрічі (conversation meetings)"
description: >-
  Weekly French conversation meetings at the IFU médiathèque, led by native-speaking teachers, for
  course students and library readers: news, society, cinema, music, everyday life.
languages:
  - fr
format: offline
