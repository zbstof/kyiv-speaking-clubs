notes:
  uk: >-
    Life.pravda (28 Jul 2022, за переліком омбудсмана Тараса Кременя): для Києва було лише 3 позиції
    — курс на основі Duolingo для англомовних (Європейський університет), відеоуроки Авраменка та
    клуб «Єдині» з 10 локаціями. КМДА (1 Sep 2023): 17-й курс стартує 4 Sep 2023; клуби діють у 28
    містах. Окремі київські локації подано окремими записами. На сайті yedyni.org (перевірено Nov
    2026) немає адрес київських клубів; остання зазначена минула подія — 19 Dec 2024.
  en: >-
    Life.pravda (28 Jul 2022, from ombudsman Taras Kremin's list): Kyiv had only 3 entries -
    Duolingo-based course for English speakers (European University), Avramenko video lessons, and
    the "Yedyni" club with 10 locations. KCSA (1 Sep 2023): 17th course starts 4 Sep 2023; clubs in
    28 cities. Individual Kyiv locations are listed as separate records. The yedyni.org site
    (checked Nov 2026) lists no Kyiv club addresses; its last listed past event is 19 Dec 2024.
