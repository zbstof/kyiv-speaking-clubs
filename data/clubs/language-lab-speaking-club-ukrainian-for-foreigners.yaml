id: language-lab-speaking-club-ukrainian-for-foreigners
name: Language Lab Speaking Club (Ukrainian for foreigners)
description: >-
  Free online Ukrainian speaking-club sessions on Zoom run by the Kyiv school Language Lab, led by
  native-speaking facilitators; mix of Ukrainian and English. Kyiv Post partner content.
languages:
  - uk
  - en
levels:
  - any
format: online
location:
  venue: Online (Zoom); Language Lab
  address: вул. Ярославів Вал, 11
schedule_note: >-
  Регулярного розкладу немає, клуби анонсують окремо. Остання зустріч — 23.08.2026, неділя, 19:00, у
  Zoom (до Дня Незалежності). Реєстрація через форму на сайті, посилання надсилають на пошту.
price:
  free: true
registration: required
contacts:
  - type: website
    url: https://lngglab.com/speaking-club
  - type: email
    url: info@languagelab.ua
  - type: website
    url: https://lngglab.com/
organizer: Language Lab (founder Ksenia Golubytska)
status: active
last_seen: "2026-08-23"
sources:
  - https://www.kyivpost.com/post/82766
  - https://www.kyivpost.com/post/76320
  - https://www.kyivpost.com/post/85262
  - https://lngglab.com/
notes: >-
  Language Lab teaches Ukrainian to foreigners online and in person in Kyiv; started in 2016 as an
  English school. Regular club schedule not verified. Site: 'Speaking Clubs: online & in-person
  language practice for all levels'; school near Golden Gate. Free online Independence Day edition
  Sun 2026-08-23 19:00 (Zoom). Kyiv Post 'More on Language Lab' dated 2026-08-20.
i18n:
  uk:
    name: Language Lab Speaking Club (Українська для іноземців)
    description: >-
      Безкоштовні онлайн-сесії розмовного клубу української в Zoom від київської школи Language Lab,
      які ведуть носії мови; поєднання української та англійської. Партнерський матеріал Kyiv Post.
    notes: >-
      Language Lab навчає іноземців української онлайн і офлайн у Києві; заснована 2016 року як
      школа англійської. Регулярний розклад клубів не підтверджено. Сайт: "Розмовні клуби: онлайн і
      офлайн — практика мови для всіх рівнів"; школа біля Золотих Воріт. Безкоштовна онлайн-версія
      до Дня Незалежності — неділя 2026-08-23 19:00 (Zoom). Матеріал Kyiv Post "More on Language
      Lab" від 2026-08-20.
    location.venue: Онлайн (Zoom); Language Lab
  en:
    schedule_note: >-
      There is no regular schedule; clubs are announced separately. Last meeting — 23.08.2026,
      Sunday, 19:00, on Zoom (for Independence Day). Registration via the form on the website; the
      link is sent by email.
    location.address: 11 Yaroslaviv Val St
