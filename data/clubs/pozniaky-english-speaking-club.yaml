notes:
  uk: >-
    Відновив роботу в травні 2023: вівторок 19:00–22:00, Пузата Хата в ТРЦ «Піраміда» (вул. Мишуги,
    4). У довіднику LEC раніше — понеділок і четвер там само. З вересня 2026 з безпекових причин —
    паб «Пивна Дума», 2-й поверх. За словами організаторів (03.11.2026), клуб існує 15 років;
    Telegram-група — з травня 2023. Telegram-група клубу, прочитано 10.11.2026.
  en: >-
    Resumed in May 2023: Tuesdays 19:00–22:00, Puzata Khata in the "Piramida" shopping mall (4
    Myshuhy St). Previously listed in the LEC directory as Mondays and Thursdays at the same venue.
    Since September 2026, at the "Pyvna Duma" pub, 2nd floor, for safety reasons. According to the
    organizers (03.11.2026), the club has existed for 15 years; the Telegram group dates back to May
    2023. Club's Telegram group, accessed 10.11.2026.
