id: vadym-stolar-foundation-language-club
name:
  uk: Мовний клуб Фонду Вадима Столара (проєкт «Курс української мови»)
  en: Vadim Stolar Foundation Language Club (Ukrainian Language Course project)
description:
  uk: >-
    Мовний клуб у межах благодійного проєкту «Курс української мови» для людей, які хочуть вільно
    говорити українською, але бояться помилок; анонсовано онлайн- та офлайн-зустрічі (Київ).
  en: >-
    Language club within the charity project "Ukrainian Language Course" for people who want to
    speak Ukrainian freely but fear making mistakes; online and offline (Kyiv) meetings were
    announced.
languages:
  - uk
levels:
  - any
format: hybrid
schedule_note:
  uk: Анонсовано 18 Feb 2026; дати зустрічей повідомлять на сторінках фонду.
  en: Announced 18 Feb 2026; meeting dates to be announced on the foundation's pages.
