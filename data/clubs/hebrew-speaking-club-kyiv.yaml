id: hebrew-speaking-club-kyiv
name:
  uk: Розмовний клуб івриту «What's about to talk?!» / «А поговорить?!» (Київ)
  en: Hebrew Speaking Club "What's about to talk?!" / "A pogovorit?!" (Kyiv)
description:
  uk: >-
    Розмовний клуб для тих, хто вивчає іврит, як продовження навчання в ульпані. Кожна зустріч — це
    розмова на заздалегідь визначену тему, часто про єврейські традиції та свята; запрошують гостей
    — носіїв мови. Першим містом став Київ; згодом осередки відкрилися в Чернівцях, Мелітополі,
    Вінниці, Кропивницькому, Львові та Харкові.
  en: >-
    Conversation club for Hebrew learners as a follow-up to ulpan study. Each meeting is a
    conversation on a topic set in advance, often about Jewish tradition and holidays;
    native-speaker guests are invited. Kyiv was the first city; branches later opened in Chernivtsi,
    Melitopol, Vinnytsia, Kropyvnytskyi, Lviv, Kharkiv.
languages:
  - he
levels:
  - any
format: hybrid
location:
  venue:
    uk: Кафе KAFFA (відкриття 5-го сезону, 2020-09-02); онлайн у Zoom з березня 2020
    en: Cafe KAFFA (season 5 opening, 2020-09-02); online on Zoom from March 2020
  lat: 50.465839
  lon: 30.520084
  geocoded: true
schedule_note:
  uk: >-
    Сезони починаються у вересні; зустрічі проходять в аудиторії чи кафе, з березня 2020 — онлайн.
    Точні день і час у знайдених джерелах не вказані.
  en: >-
    Seasons run from September; meetings in class/cafe, online since March 2020. Exact day and time
    not published in the sources found.
