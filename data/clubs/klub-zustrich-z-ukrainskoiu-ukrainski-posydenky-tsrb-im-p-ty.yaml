notes: >-
  Listed in both Kyiv culture-department library lists (2023-08-17 and 2025-12-01). The lists give
  no meeting times. District inferred from the address, not verified. 2023 list: «Розмовний клуб
  української мови». A Sept 2023 conference paper names the club «Українські посиденьки», founded by
  poet and volunteer Olena Tatianchenko. Dec 2025 list: «Зустріч з українською».
