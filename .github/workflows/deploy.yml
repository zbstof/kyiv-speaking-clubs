name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.first_try.outputs.page_url || steps.second_try.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # deploy-pages sometimes fails with "No artifacts named github-pages were found" right after
      # a successful upload (seen on 2026-11-10); a second attempt half a minute later succeeds.
      - id: first_try
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.first_try.outcome == 'failure'
        run: sleep 30
      - id: second_try
        if: steps.first_try.outcome == 'failure'
        uses: actions/deploy-pages@v4
