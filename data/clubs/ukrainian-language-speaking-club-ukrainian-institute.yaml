id: ukrainian-language-speaking-club-ukrainian-institute
name:
  uk: Розмовний клуб української мови (Український інститут)
  en: Ukrainian Language Speaking Club (Ukrainian Institute)
description:
  uk: >-
    Безкоштовний онлайн-клуб розмовної української для іноземців із рівнем B1+; щотижневі
    90-хвилинні зустрічі в Zoom, дати оголошують заздалегідь.
  en: >-
    Free online Ukrainian conversation club for international learners at B1+; weekly 90-minute Zoom
    sessions, dates announced in advance.
