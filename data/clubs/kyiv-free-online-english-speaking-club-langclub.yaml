id: kyiv-free-online-english-speaking-club-langclub
name:
  uk: Безкоштовний онлайн-розмовний клуб англійської для Києва (Langclub)
  en: Kyiv Free Online English Speaking Club (Langclub)
description:
  uk: >-
    Безкоштовна розмовна практика англійської онлайн із записом через langclub.live; Meetup-група з
    Києвом у назві.
  en: Free online English speaking practice booked via langclub.live; Meetup group named for Kyiv.
languages:
