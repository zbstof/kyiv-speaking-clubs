id: dnipro-hills-toastmasters-club
name:
  uk: Dnipro Hills Toastmasters Club
  en: Dnipro Hills Toastmasters Club
description:
  uk: >-
    Англомовний клуб ораторського мистецтва та лідерства, що входить до Toastmasters International;
    дата заснування — August 2002.
  en: >-
    English public speaking and leadership club, part of Toastmasters International; founded August
    2002.
languages:
  - en
format: hybrid
location:
  venue:
    uk: X-Lounge (колишній TIKE)
    en: X-Lounge (formerly TIKE)
  address:
    uk: вул. Петра Сагайдачного, 31
    en: 31 Petra Sahaidachnoho St
  metro:
    uk: Поштова площа
    en: Poshtova Ploshcha
  lat: 50.461318
  lon: 30.520958
  geocoded: true
schedule:
  - day: sun
    time: "12:00"
    duration_min: 120
    frequency: weekly
    format: offline
schedule_note:
  uk: >-
    Щонеділі о 12:00–14:00, потім неформальне спілкування. Зазвичай наживо в ресторані X-Lounge; за
    словами клубу, приблизно раз на місяць зустріч онлайн або змішана (Zoom). Гостям безкоштовно,
    клуб просить замовити напій чи їжу в ресторані.
  en: >-
    Every Sunday at 12:00–14:00, followed by informal socializing. Usually in person at X-Lounge
    restaurant; according to the club, about once a month the meeting is online or hybrid (Zoom).
    Free for guests; the club asks attendees to order a drink or food at the restaurant.
price:
  free: false
  amount:
    uk: >-
      Гостям вхід вільний, але лише знайомство й Table Topics (імпровізовані виступи); повна участь
      — членство: $25 вступний + $72 і $15 клубний внесок за 6 міс..
    en: >-
      Guests attend free, but only for introductions and Table Topics (impromptu speaking); full
      participation needs membership: $25 joining fee + $72 and a $15 club fee per 6 months.
registration: optional
