id: widerstrahl-german-culture-centre
name: Widerstrahl German Culture Centre speaking clubs (ЦНК «Widerstrahl»)
description: >-
  German culture centre of Kyiv ethnic Germans; runs German conversation clubs for children, an
  adult discussion club by level, video clubs, guide-interpreter club; led by native speakers.
  Includes German study club 'August'.
languages:
  - de
format: offline
location:
  venue: Німецький Дім Київ — ЦНК «Відерштраль»
  address: вул. Володимирська, 37
  lat: 50.449829
  lon: 30.515313
  geocoded: true
schedule_note: >-
  Розклад клубу не опубліковано. На сайті клуб розмовної практики для дітей, підлітків і дорослих
  згадано без дат. Деталі — в адміністрації: (097) 346-10-43.
contacts:
  - type: website
    url: http://www.widerstrahl.org
  - type: email
    url: mailto:widerstrahl@gmail.com
  - type: phone
    url: tel:+380442393145
  - type: phone
    url: tel:+380973461043
  - type: instagram
    url: https://www.instagram.com/deutsches_haus_kyiv
  - type: facebook
    url: https://www.facebook.com/WiderstrahlKyiv
organizer: Центр німецької культури «Widerstrahl» (charity founded 1992)
status: active
first_seen: "2010-08-30"
last_seen: "2026-10-23"
sources:
  - https://osvita.ua/languages/speak_club/8868/
  - http://www.widerstrahl.org
  - https://osvita.ua/languages/speak_club/
  - https://osvita.ua/languages/courses/8863/
  - https://www.education.ua/courses/company/2484/
notes: >-
  Website (checked 2026-11) lists 'клуб розмовної практики для дітей, підлітків, дорослих'; latest
  site news 2026-10-23. No club schedule on site. Second osvita card (updated 2013-08-21,
  https://osvita.ua/languages/courses/8863/) lists: conversation club for children, discussion club
  for adults by level, video clubs, guide-interpreter club. The centre now trades as Deutsches
  Haus-Kyjiw (education.ua card updated 2026-08-26 lists courses, no club). Phone is the centre's
  public office line.
