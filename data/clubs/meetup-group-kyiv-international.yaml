    format: offline
schedule_note:
  uk: >-
    У 2023–2025 — приблизно раз на два тижні в суботу о 15:00; кафе оголошували в групі. Після
    квітня 2025 власних зустрічей не було, лише анонси інших подій.
  en: >-
    In 2023–2025, roughly every other Saturday at 15:00; the café was announced in the group. After
    April 2025, there were no meetups of their own, only announcements of other events.
