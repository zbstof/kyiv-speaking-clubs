id: rozmovni-kluby-biblioteky-im-m-hoholia-spilkuimosia-ukrainsk
name:
  uk: >-
    Розмовні клуби бібліотеки ім. М. Гоголя: «Спілкуймося українською» (Юрій Баланчук), клуб
    українського гумору, «Єдині»
  en: >-
    Conversation clubs at the M. Hohol Library: "Spilkuimosia ukrainskoiu" (Yurii Balanchuk), a
    Ukrainian humour club, "Yedyni"
description:
  uk: >-
    Безкоштовний розмовний клуб української мови в публічній бібліотеці Києва для тих, хто
    переходить на українську або вдосконалює її.
  en: >-
    Free Ukrainian conversation club at a Kyiv public library, for people switching to Ukrainian or
    improving it.
languages:
  - uk
format: offline
