    description: >-
      An offline English club in Pozniaky. Meetings are also announced by the online club BlaBla
      English UA, where the host, Vadym, also volunteers.
    schedule_note: Every Tuesday, 19:00–22:00. The host reserves a table; the group chat specifies which table.
    notes: >-
      Resumed in May 2023: Tuesdays 19:00–22:00, Puzata Khata in the "Piramida" shopping mall (4
      Myshuhy St). Previously listed in the LEC directory as Mondays and Thursdays at the same
      venue. Since September 2026, at the "Pyvna Duma" pub, 2nd floor, for safety reasons. According
      to the organizers (03.11.2026), the club has existed for 15 years; the Telegram group dates
      back to May 2023. Club's Telegram group, accessed 10.11.2026.
