notes: >-
  Listed in both Kyiv culture-department library lists (2023-08-17 and 2025-12-01). The lists give
  no meeting times. District inferred from the address, not verified. 2023: «Розмовний клуб для
  дорослих «У суботу о 12-тій»» plus group and individual lessons. 2025: club «Мовосвіт» in
  partnership with «Єдині»; advanced and basic Ukrainian courses for adults, teen courses, NMT prep
  online, children's groups in speaking-club format. Telegram channel @movosvit.
