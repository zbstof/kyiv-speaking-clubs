    en: 49-A Volodymyrska St; 1 Ivana Mazepy St
  lat: 50.44762
  lon: 30.51598
  geocoded: true
schedule_note:
  uk: >-
    Нерегулярно ввечері, 18:00–19:00; 9 подій, наприклад 2015-07-07, 2015-10-09, 2015-11-03,
    2015-11-25
  en: Irregular evenings 18:00–19:00; 9 events, e.g. 2015-07-07, 2015-10-09, 2015-11-03, 2015-11-25
