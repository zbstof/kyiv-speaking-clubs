id: movnyi-kurs-navchai-ukrainskoiu-iedyni-biblioteka-im-v-symon
name:
  uk: Мовний курс «Навчай українською» («Єдині») — бібліотека ім. В. Симоненка
  en: Language course "Navchai ukrainskoiu" ("Yedyni") — V. Symonenko Library
description:
  uk: >-
    Безкоштовний розмовний курс/клуб української мови від руху «Єдині» (ініціатива «Навчай
    українською») у публічній бібліотеці Києва.
  en: >-
    Free Ukrainian conversation course/club run by the "Yedyni" movement ("Navchai ukrainskoiu"
    initiative) at a Kyiv public library.
