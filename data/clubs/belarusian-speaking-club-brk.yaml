id: belarusian-speaking-club-brk
name:
  uk: Білоруський розмовний клуб у Києві (Білоруський розмовний клуб, БРК)
  en: Belarusian Speaking Club in Kyiv (Belaruski razmouny klub, BRK)
description:
  uk: >-
    Розмовний клуб білоруської мови в Києві; у науковій статті 2019 року його досліджували як модель
    організації розмовних клубів; у 2017 році Громадське радіо розповідало про нього як про місце,
    де можна побачити спільне й відмінне між білорусами та українцями.
  en: >-
    Belarusian language speaking club in Kyiv; studied in a 2019 academic article as a model for
    organizing speaking clubs; Hromadske Radio covered it in 2017 as a place to see what is similar
    and different between Belarusians and Ukrainians.
languages:
  - be
levels:
  - any
format: offline
location:
  venue:
    uk: >-
      Антикафе поруч із Києво-Могилянською академією (перший рік: Центр білоруської мови та
      культури, Інститут філології КНУ)
    en: >-
      Anticafe next to Kyiv-Mohyla Academy (first year: Center of Belarusian Language and Culture,
      Institute of Philology, KNU)
  metro:
    uk: Контрактова площа
    en: Kontraktova Ploshcha
  lat: 50.465835
  lon: 30.515081
  geocoded: true
  near_metro: true
schedule:
  - day: tue
    frequency: biweekly
schedule_note:
  uk: Раз на два тижні у вівторок
  en: Every other Tuesday
organizer: Founder and moderator Andrii Buhai (Андрій Бугай), engineer
status: unknown
first_seen: "2009"
last_seen: "2019-02-15"
sources:
  - >-
    https://ijbg.uw.edu.pl/en/issues/2/history-and-practice-of-organizing-speaking-clubs-based-on-the-experience-of-the-belarusian-speaking-club-in-kyiv
  - >-
    https://api.publisphere.edu.pl/open/journal_article_files/019fb79e-d929-7183-b7c9-e08829a4e6f2/download?v=1
  - >-
    https://hromadske.radio/programs/kyiv-donbas/klub-biloruskoyi-movy-vkyyevi-dopomagaye-zrozumity-shozhe-i-vidminne-mizhdvoma-narodamy
notes:
  uk: >-
    Стаття: Старавойтава та Теадорович, «Білоруська мова як іноземна», 2/2018. Також згадано:
    матеріал Громадського радіо від 2017-05-04 «Клуб білоруської мови в Києві». Стаття Надзеї
    Старавойтавої та Артема Теадоровича (IJBG, опубліковано 2019-02-15). Сторінка Громадського радіо
    (2017) тепер повертає помилку 404. Автори статті: Надзея Старавойтава, Артем Теадорович
    (Міжнародний журнал білоруських студій, том 2, 2018, опубліковано 2019-02-15). Дати стосуються
    публікацій, а не діяльності клубу.
  en: >-
    Article: Staravojtava & Teadarovich, "Belarusian as a Foreign Language" 2/2018. Also cited:
    Hromadske Radio piece 2017-05-04 "Belarusian Language Club in Kyiv". Article by Nadzieja
    Staravojtava and Artsyom Teadarovich (IJBG, published 2019-02-15). Hromadske Radio page (2017)
    now returns 404. Article authors: Nadzieja Staravojtava, Artsyom Teadarovich (International
    Journal of Belarusian Studies, vol. 2, 2018, published 2019-02-15). Dates are the publication
    date, not club activity dates.
