id: it-skills-english-club-it-english-club-english4qa
name:
  uk: IT Skills English club / IT English club (english4qa)
  en: IT Skills English club / IT English club (english4qa)
description:
  uk: >-
    Безкоштовний розмовний клуб англійської для ІТ-фахівців і новачків в ІТ: тематичні обговорення,
    ігри («Скраматон», «Проведи співбесіду або пройди її», «Переговори в ІТ», «GitHub-мафія»). У
    всіх оголошеннях той самий контактний номер телефону.
  en: >-
    Free English speaking club for IT people and newcomers to IT: themed discussions, games
    ('Scrumathon', 'Interview or be interviewed', 'Negotiations in IT', 'GitHub-mafia'). Same
    contact phone across all listings.
languages:
  - en
format: offline
location:
  venue:
    uk: >-
      Кафе «Олів'є» (2017–2018); кафе на 5-му поверсі ТРЦ «Гуллівер» (2016); поблизу «Шулявської»
      (початок 2016)
    en: >-
      Olivie Café (2017–2018); café on the 5th floor of Gulliver shopping mall (2016); near
      Shuliavska (early 2016)
  address:
    uk: вул. Богдана Хмельницького, 16-22 (Олів'є)
    en: 16-22 Bohdana Khmelnytskoho St (Olivie)
  metro:
    uk: Театральна
    en: Teatralna
  lat: 50.44521
  lon: 30.518045
  geocoded: true
  near_metro: true
schedule:
  - day: sun
    frequency: irregular
schedule_note:
  uk: >-
    Приблизно щотижня, у вихідні або ввечері в будні; наприклад, нд 2016-01-17 11:30, вт 2016-09-20
    19:00, нд 2017-04-02 18:00–21:00, сб 2018-01-27 18:00
  en: >-
    Roughly weekly, weekends or weekday evenings; e.g. Sun 2016-01-17 11:30, Tue 2016-09-20 19:00,
    Sun 2017-04-02 18:00–21:00, Sat 2018-01-27 18:00
price:
