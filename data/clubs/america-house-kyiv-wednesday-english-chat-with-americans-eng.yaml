notes: >-
  Registration via Google Form, ID needed at entry. Names over time: 'Wednesday English @America
  House' (WE@AH, 2016–2018), 'Conversation Club' (2022–spring 2023), 'Wednesday English: Chat with
  Americans' (2023–2024), 'Wednesday English with Charlie' (2024–2026). Sessions seen weekly Sep–Nov
  2026. AHK also ran an American Lit Club, American Studies Club and 'Between the Lines' book club,
  and hosted the 2016-05-28 'largest English lesson in the world' conversation-club event.
