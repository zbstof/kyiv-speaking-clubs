  uk:
    name: Stammtisch (німецькомовний клуб, Дім Бергоньє)
    description: >-
      Щотижневі безкоштовні німецькомовні зустрічі українців і німців: обговорення новин, обмін
      знаннями. Учасники мають розуміти розмову німецькою, вільне володіння мовою не обов’язкове.
    schedule_note: Середа, 7 p.m.
    notes: >-
      За даними Kyiv Post (2017-09-29), клуб проводить зустрічі щонайменше з 1997 року; група у
      Facebook (нині має назву «Deutscher Mittwochs-Stammtisch Kyjiw», відкрита, 608 учасників на
      момент перевірки 2026-11) у 2017 році налічувала понад 200 учасників; на кожну зустріч
      приходить близько 15 людей. Існує Telegram-акаунт @stammtisch_kyiv, але його зв’язок із цією
      групою не підтверджено. Рівні володіння мовою визначено приблизно на основі вимоги «потрібно
      розуміти розмови». Зустрічі задокументовані щонайменше з 1997 року. Попереднє місце зустрічей:
      ресторан Muka на Хрещатику (закрився восени 2016 року). 200+ учасників групи у Facebook, ~15
      на кожній зустрічі.
    location.venue: Арткафе «Дім Бергоньє»
