id: language-lab-speaking-club-ukrainian-for-foreigners
name: Language Lab Speaking Club (Ukrainian for foreigners)
description: >-
  Free online Ukrainian speaking-club sessions on Zoom run by the Kyiv school Language Lab, led by
  native-speaking facilitators; mix of Ukrainian and English. Kyiv Post partner content.
languages:
  - uk
  - en
levels:
  - any
format: online
location:
  venue: Online (Zoom); Language Lab
  address: вул. Ярославів Вал, 11
schedule_note: >-
  Регулярного розкладу немає, клуби анонсують окремо. Остання зустріч — 23.08.2026, неділя, 19:00, у
  Zoom (до Дня Незалежності). Реєстрація через форму на сайті, посилання надсилають на пошту.
price:
  free: true
registration: required
contacts:
