name = "kyiv-speaking-clubs"
main = "src/index.js"
compatibility_date = "2025-10-01"

[vars]
REPO = "zbstof/kyiv-speaking-clubs"
BASE_BRANCH = "main"
# Comma-separated list of site origins allowed to call the worker.
ALLOWED_ORIGINS = "https://zbstof.github.io,http://localhost:8080"
OPENAI_MODEL = "gpt-6.1-sol"

# At most 5 suggestions per minute from one IP address.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 5
  period = 60

# Secrets, set with:
#   npx wrangler secret put GITHUB_TOKEN      # fine-grained token: this repo only; Contents + Pull requests + Issues: read/write
#   npx wrangler secret put TURNSTILE_SECRET
#   npx wrangler secret put OPENAI_API_KEY    # optional: translates suggestions into the missing language
