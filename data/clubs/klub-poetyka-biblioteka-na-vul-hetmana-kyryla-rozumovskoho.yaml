notes:
  uk: >-
    Є в переліку бібліотек Департаменту культури Києва станом на 2025-12-01. У переліках не вказано
    часу зустрічей. Район визначено за адресою, не перевірено. Популяризує українську етнічну
    культуру. У переліку за 2023 рік був «Розмовний клуб» у «бібліотеці на вул. Краснова, 10» (тел.
    (044) 424-33-07); вулицю перейменували, тож, імовірно, це та сама бібліотека — не перевірено.
  en: >-
    Listed in the Kyiv culture-department library list as of 2025-12-01. The lists give no meeting
    times. District inferred from the address, not verified. Popularises Ukrainian ethnic culture.
    The 2023 list had a "Conversation club" at the "library at 10 Krasnova St" (tel. (044)
    424-33-07); the street was renamed, so it is probably the same library - not verified.
