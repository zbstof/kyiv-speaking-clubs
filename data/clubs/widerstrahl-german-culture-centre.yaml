id: widerstrahl-german-culture-centre
name: Widerstrahl German Culture Centre speaking clubs (ЦНК «Widerstrahl»)
description: >-
  German culture centre of Kyiv ethnic Germans; runs German conversation clubs for children, an
  adult discussion club by level, video clubs, guide-interpreter club; led by native speakers.
  Includes German study club 'August'.
