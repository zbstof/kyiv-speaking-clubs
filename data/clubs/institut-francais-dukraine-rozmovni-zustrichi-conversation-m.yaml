notes:
  uk: >-
    Станом на 2026-11 на сторінці заняття позначено як «Тимчасово недоступно». На цій же сторінці
    зазначено літературні зустрічі 1-2 рази на місяць у п’ятницю ввечері, які також призупинено. У
    календарі IFU за 2018 рік було зазначено «Club de conversation» для дітей віком 11-13 років
    (реєстрація 21.05-20.06.2018).
  en: >-
    The page marks the activity as "Temporarily unavailable" as of 2026-11. The same page lists
    literary meetings 1-2 times a month on Friday evenings, also suspended. A 2018 IFU calendar
    listed a "Club de conversation" for ages 11-13 (sign-up 21.05-20.06.2018).
