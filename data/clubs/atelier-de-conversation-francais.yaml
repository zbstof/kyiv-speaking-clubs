id: atelier-de-conversation-francais
name:
  uk: Atelier de Conversation Français
  en: Atelier de Conversation Français
description:
  uk: >-
    Щотижневі розмовні зустрічі французькою в київських кафе: вільна розмова, іноді на тему вечора.
    Приходять франкомовні іноземці, які живуть у Києві, і ті, хто вчить мову. Влітку бували й
    велопрогулянки.
  en: >-
    Weekly French conversation meetings in Kyiv cafés: free conversation, sometimes on a topic of
    the evening. French speakers living in Kyiv come along with learners. In summer there were bike
    rides too.
languages:
  - fr
format: offline
