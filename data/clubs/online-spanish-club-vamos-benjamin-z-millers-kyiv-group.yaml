id: online-spanish-club-vamos-benjamin-z-millers-kyiv-group
name:
  uk: Онлайн-клуб іспанської «Vamos»! (Київська група Бенджаміна З. Міллера)
  en: Online Spanish Club 'Vamos'! (Benjamin Z Miller's Kyiv Group)
description:
  uk: Онлайн-розмовний клуб іспанської від київської Meetup-групи для експатів та українців.
  en: Online Spanish conversation club run by a Kyiv Meetup group for expats and Ukrainians.
languages:
  - es
format: online
schedule:
  - day: sun
    time: "17:00"
    duration_min: 60
    frequency: weekly
    format: online
schedule_note:
  uk: >-
    Щонеділі о 17:00, 1 година, онлайн. Запис на Meetup; опис і посилання бачать лише учасники
    групи. На всіх подіях у Meetup записаний лише ведучий, тож чи збираються люди, не перевірено.
  en: >-
    Every Sunday at 17:00, 1 hour, online. Sign up on Meetup; only group members can see the
    description and link. Only the host is signed up for any of the Meetup events, so whether people
    actually attend has not been verified.
registration: required
contacts:
  - type: meetup
    url: https://www.meetup.com/kiev-social-for-international-expatriates-and-ukrainians/
organizer: >-
  Benjamin Z Miller's Kyiv Group - for Expats & Ukrainians (Meetup); events branded 'Ideal
  International'
status: active
first_seen: 2025-09
last_seen: "2026-11-08"
sources:
  - >-
    https://www.meetup.com/kiev-social-for-international-expatriates-and-ukrainians/events/317145351/
  - https://www.meetup.com/find/ua--kyiv/networking/
  - https://www.meetup.com/kiev-social-for-international-expatriates-and-ukrainians/
  - https://www.meetup.com/find/?location=ua--Kyiv&source=EVENTS&keywords=language%20exchange
notes:
  uk: >-
    На Meetup зазначено «Щонеділі». Подробиці події доступні лише учасникам групи. У фрагменті
    пошукової видачі була та сама подія на Sun Sep 14 (2025). У групі 773 учасники. Ціну не вказано.
  en: >-
    Meetup lists it as 'Every Sun'. Event details members-only. A search snippet showed the same
    event on Sun Sep 14 (2025). Group has 773 members. Price not stated.
