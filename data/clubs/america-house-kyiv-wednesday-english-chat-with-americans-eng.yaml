schedule_note:
  uk: >-
    Щосереди 19:00–20:30, онлайн у Zoom. Реєстрація через форму на сторінці події до 12:00 того ж
    дня, посилання на Zoom надходить на пошту в день зустрічі. Ведучий — Чарлі, з 11.11.2026 —
    Патріс.
  en: >-
    Every Wednesday 19:00–20:30, online via Zoom. Register using the form on the event page by 12:00
    the same day; the Zoom link is emailed on the day of the meeting. Hosted by Charlie, and from
    11.11.2026 by Patrice.
