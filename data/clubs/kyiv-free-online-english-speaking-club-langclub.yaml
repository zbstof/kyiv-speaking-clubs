  en:
    schedule_note: >-
      Online on Zoom, several sessions daily, registration required at langclub.live/sessions (RSVP
      on Meetup does not count). Kyiv time 10–16.11.2026: daily at 15:00, in the evening at
      19:00–21:00 and at night at 03:00, on weekends also at 14:00. The Meetup group has not posted
      events since 19.09.2026.
