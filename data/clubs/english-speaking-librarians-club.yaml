id: english-speaking-librarians-club
name: English-Speaking Librarians' Club
description: >-
  Club for library staff to practise English; part of the Ukrainian Library Association, under the
  U.S. Embassy Information Resource Center. Started by Peace Corps volunteer librarian Donna Usher.
languages:
  - en
format: offline
organizer: Ukrainian Library Association / U.S. Embassy IRC
status: unknown
first_seen: "1997"
sources:
  - https://southernlibrarianship.icaap.org/content/v03n01/Barrett_g01.htm
notes: >-
  About 30 members from different libraries (source c. 2002). Only for librarians. No evidence of
  activity after 2010 found.
i18n:
  uk:
    name: Клуб англомовних бібліотекарів
    description: >-
      Клуб для працівників бібліотек для практики англійської мови; частина Української бібліотечної
      асоціації, при Інформаційно-ресурсному центрі Посольства США. Заснований волонтеркою Корпусу
      Миру, бібліотекаркою Донною Ашер.
    notes: >-
      Близько 30 членів із різних бібліотек (джерело c. 2002). Тільки для бібліотекарів. Не знайдено
      доказів діяльності після 2010.
