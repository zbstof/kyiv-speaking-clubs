name: Interclub KPI / Ukrainian Speaking Club for foreigners (КПІ ім. Ігоря Сікорського)
description: >-
  Student support club for foreign students at Igor Sikorsky Kyiv Polytechnic Institute: weekly
  meetings to learn about Ukrainian language and culture; the Students' Social Service of KPI
  described free group sessions for foreigners on Thursdays as a «Ukrainian Speaking Club».
