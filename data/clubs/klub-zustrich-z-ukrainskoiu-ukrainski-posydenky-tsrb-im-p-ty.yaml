id: klub-zustrich-z-ukrainskoiu-ukrainski-posydenky-tsrb-im-p-ty
name: Клуб «Зустріч з українською» / «Українські посиденьки» (ЦРБ ім. П. Тичини)
description: >-
  Free Ukrainian conversation club at a Kyiv public library, for people switching to Ukrainian or
  improving it.
languages:
  - uk
format: offline
location:
  venue: Центральна районна бібліотека ім. П. Тичини
  address: вул. Митрополита Андрея Шептицького, 24
  lat: 50.458076
  lon: 30.59242
  geocoded: true
price:
  free: true
contacts:
  - type: phone
    url: (044) 517-42-38
