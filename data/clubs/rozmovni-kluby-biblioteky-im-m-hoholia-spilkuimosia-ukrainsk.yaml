id: rozmovni-kluby-biblioteky-im-m-hoholia-spilkuimosia-ukrainsk
name: >-
  Розмовні клуби бібліотеки ім. М. Гоголя: «Спілкуймося українською» (Юрій Баланчук), клуб
  українського гумору, «Єдині»
description: >-
  Free Ukrainian conversation club at a Kyiv public library, for people switching to Ukrainian or
  improving it.
languages:
  - uk
format: offline
location:
  venue: Бібліотека ім. М. В. Гоголя
  address: вул. Велика Васильківська, 136
  metro: Либідська
  lat: 50.413825
  lon: 30.523068
  geocoded: true
schedule:
  - day: fri
    frequency: weekly
    format: offline
schedule_note: >-
  Клуб «Спілкуймося українською» щоп'ятниці в бібліотеці, веде поет Юрій Баланчук. Час у дописах не
  вказано, уточнюйте за телефоном (044) 529-14-73. Субота в бібліотеці вихідний. Остання зустріч у
  блозі — вівторок 4 серпня 2026.
price:
