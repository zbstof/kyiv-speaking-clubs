notes:
  uk: >-
    Об’єднання багатьох клубів. В оновленні блогу за 2016 рік зазначено, що російський та
    український клуби станом на January 2016 «фактично не діяли» й шукали нових організаторів;
    німецьку групу ще згадували в Kyiv Post у 2017 році. Учасники платять лише за власну їжу.
    Зустрічі тривають близько 2 годин. У блозі (оновлення 2016 року) зазначено, що російська та
    українська групи станом на Jan 2016 «фактично не діяли»; німецька група для початківців ще
    працювала станом на Sept 2017 (Kyiv Post). Типовий вік учасників — 20-28 років. Вартість
    «безкоштовно» визначено з огляду на те, що учасники купують лише власну їжу. В оновленні блогу
    за 2016 рік зазначено, що російська та українська групи «фактично не діяли». Дата допису ФРІ
    Київ невідома. Імовірно, також охоплено іншими дослідниками (європейські мови). Продовження:
    «Sunday conversation club» LEC у «Циферблаті» 2018–2021 та книжковий клуб LEC (2019–2024). Сайт
    мережі lec.link перелічує клуби англійської, німецької, французької, іспанської, італійської й
    української; багато з них є в цьому списку окремо.
  en: >-
    Umbrella for many clubs. The blog's 2016 update says the Russian and Ukrainian clubs were
    "basically dead" in January 2016 and looking for new organizers; the German group was still
    listed by Kyiv Post in 2017. Attendees pay only for their own food. Sessions about 2 hours. Blog
    (2016 update) says the Russian and Ukrainian groups were "basically dead" by Jan 2016; the
    German beginners group was still running in Sept 2017 (Kyiv Post). Typical attendee age 20-28.
    Price "free" is inferred: participants only buy their own food. 2016 blog update says Russian
    and Ukrainian groups were "basically dead". FRI Kyiv post date unknown. Likely also covered by
    other researchers (European languages). Continuation: LEC's "Sunday conversation club" at
    "Ziferblat" in 2018–2021 and the LEC book club (2019–2024). The network's website lec.link lists
    English, German, French, Spanish, Italian and Ukrainian clubs; many of them appear separately in
    this list.
