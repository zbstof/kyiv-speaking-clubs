schedule_note:
  uk: >-
    Онлайн: посилання на Zoom публікують у Telegram-каналі за день до зустрічі. Іноді бувають
    додаткові зустрічі в понеділок. Офлайн-зустрічі щовівторка — окремий клуб Poznіaky English
    Speaking Club.
  en: >-
    Online: the Zoom link is posted in the Telegram channel the day before the meeting. There are
    sometimes extra meetings on Mondays. In-person meetings on Tuesdays are a separate club,
    Pozniaky English Speaking Club.
