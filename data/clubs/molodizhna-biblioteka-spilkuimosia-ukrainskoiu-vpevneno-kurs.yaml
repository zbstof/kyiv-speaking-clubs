notes:
  uk: >-
    Зазначено в обох переліках бібліотек київського департаменту культури (2023-08-17 і 2025-12-01).
    У переліках немає часу зустрічей. Район визначено за адресою, не перевірено. 2023: курс
    «Спілкуймося українською впевнено!». Грудень 2025: курс граматики, літературний розмовний клуб
    «Спілкуймося українською впевнено!» та розмовний клуб платформи «Єдині».
  en: >-
    Listed in both Kyiv culture-department library lists (2023-08-17 and 2025-12-01). The lists give
    no meeting times. District inferred from the address, not verified. 2023: course "Spilkuimosia
    ukrainskoiu vpevneno!". Dec 2025: grammar course, literary conversation club "Spilkuimosia
    ukrainskoiu vpevneno!" and a conversation club of the "Yedyni" platform.
