  uk:
    name: Language Lab Speaking Club (українська для іноземців)
    description: >-
      Безкоштовні онлайн-зустрічі розмовного клубу української мови в Zoom від київської школи
      Language Lab із модераторами — носіями мови; спілкування українською та англійською.
      Партнерський матеріал Kyiv Post.
    notes: >-
      Language Lab навчає іноземців української онлайн та очно в Києві; школа почала працювати у
      2016 році як школа англійської. Регулярний розклад клубу не підтверджено. На сайті: «Розмовні
      клуби: мовна практика онлайн та очно для всіх рівнів»; школа біля Золотих воріт. Безкоштовна
      онлайн-зустріч до Дня Незалежності — неділя, 2026-08-23, 19:00 (Zoom). Матеріал Kyiv Post
      «Більше про Language Lab» від 2026-08-20.
    location.venue: Онлайн (Zoom); Language Lab
