id: meetup-group-kyiv-international
name:
  uk: Meetup group 🌍 (міжнародні зустрічі)
  en: Meetup group 🌍 (international meetups)
description:
  uk: >-
    Соціальна група іноземців і українців у Києві: суботні зустрічі англійською в кафе, щоразу в
    іншому (Первак, Чорноморка, 74 urbanfood, Breakfast Club та інші).
  en: >-
    A social group for foreigners and Ukrainians in Kyiv: Saturday meetups in English at a different
    café each time (Pervak, Chornomorka, 74 urbanfood, Breakfast Club and others).
