  en: English speaking club at Lesya Ukrainka Public Library (Rusanivka)
description:
  uk: >-
    Суботній англомовний клуб у відділі літератури іноземними мовами публічної бібліотеки. Тему
    оголошують заздалегідь; у бібліотеці також є кіноклуб.
  en: >-
    Saturday English speaking club in the public library’s foreign-language literature department.
    The topic is announced in advance; the library also has a film club.
