    en: 19 Shota Rustaveli St
  note:
    uk: >-
      Місце змінюється: також ресторан RUMI (Бессарабська пл., 9) і перуанський ресторан в укритті.
      Адреса — в анонсі в групі.
    en: >-
      The venue changes: also RUMI restaurant (9 Bessarabska Sq) and a Peruvian restaurant in a
      shelter. The address is in the group's announcement.
