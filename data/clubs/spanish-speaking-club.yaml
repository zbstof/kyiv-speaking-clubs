  en: Spanish speaking club
description:
  uk: >-
    Розмовний клуб іспанської для тих, хто вже знає мову й хоче практикувати. На зустрічі приходять
    і носії мови. Розмовляють лише іспанською; буває кіноклуб.
  en: >-
    A Spanish speaking club for those who already know the language and want to practise. Native
    speakers also attend. Only Spanish is spoken; there are occasional film club sessions.
