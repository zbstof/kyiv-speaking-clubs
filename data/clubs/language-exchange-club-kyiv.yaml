id: language-exchange-club-kyiv
name: Language Exchange Club Kyiv
description: >-
  Free network of language groups meeting in cheap restaurants; separate groups per language
  (English, Russian, Ukrainian, German, French and others), about 2 hours per meeting.
languages:
  - en
  - ru
  - uk
  - de
  - fr
  - pl
  - tr
levels:
  - any
format: offline
location:
  venue: Puzata Khata (most meetings)
  metro: Контрактова площа
  lat: 50.43742
  lon: 30.515754
  geocoded: true
schedule_note: About 2 hours per meeting; FRI Kyiv post says meetings happen daily, language varies.
price:
  free: true
registration: none
contacts:
  - type: website
    url: http://languageexchangekyiv.ning.com
  - type: facebook
    url: https://www.facebook.com/groups/82542151162
  - type: website
    url: https://lec.link/
organizer: Language Exchange Club; co-founded by US expat John Carragee
status: unknown
first_seen: 2009-05
last_seen: 2021-12
sources:
  - https://tryukraine.blogspot.com/2010/07/getting-to-know-people-through-language.html
  - https://www.kyivpost.com/lifestyle/language-unites-ukrainians-germans-meet-weekly.html
  - >-
    https://m.facebook.com/fri.kyiv/photos/%D0%B2%D0%B8%D0%B2%D1%87%D0%B5%D0%BD%D0%BD%D1%8F-%D0%B0%D0%BD%D0%B3%D0%BB%D1%96%D0%B9%D1%81%D1%8C%D0%BA%D0%BE%D1%97-%D0%B7%D0%B0%D0%B4%D0%B0%D1%80%D0%BC%D0%B0-%D1%82%D0%BE%D0%BF-5-%D0%BC%D0%BE%D0%B6%D0%BB%D0%B8%D0%B2%D0%BE%D1%81%D1%82%D0%B5%D0%B9-%D0%BA%D0%B8%D1%94%D0%B2%D0%B0-%D1%80%D0%BE%D0%B7%D0%BC%D0%BE%D0%B2%D0%BD%D0%B8%D0%B9-%D0%BA%D0%BB%D1%83%D0%B1-friday-night/917933301689501/
  - https://lec.link/
notes: >-
  Umbrella for many clubs. The blog's 2016 update says the Russian and Ukrainian clubs were
  'basically dead' in January 2016 and looking for new organizers; the German group was still listed
  by Kyiv Post in 2017. Attendees pay only for their own food. Sessions about 2 hours. Blog (2016
  update) says the Russian and Ukrainian groups were 'basically dead' by Jan 2016; the German
  beginners group was still running in Sept 2017 (Kyiv Post). Typical attendee age 20-28. Price
  'free' is inferred: participants only buy their own food. 2016 blog update says Russian and
  Ukrainian groups were 'basically dead'. FRI Kyiv post date unknown. Likely also covered by other
  researchers (European languages). Продовження: «Sunday conversation club» LEC у «Циферблаті»
  2018–2021 та книжковий клуб LEC (2019–2024). Сайт мережі lec.link перелічує клуби англійської,
  німецької, французької, іспанської, італійської й української; багато з них є в цьому списку
  окремо.
i18n:
  uk:
    name: Київський клуб мовного обміну
    description: >-
      Безкоштовна мережа мовних груп, що зустрічаються в недорогих ресторанах; окремі групи для
      кожної мови (англійська, російська, українська, німецька, французька та інші), приблизно 2
      години на зустріч.
    schedule_note: >-
      Приблизно 2 години на зустріч; повідомлення FRI Kyiv каже, що зустрічі відбуваються щоденно,
      мова варіюється.
    notes: >-
      Об'єднання для багатьох клубів. У блозі (оновлення 2016) зазначено, що російські та українські
      клуби були "в принципі мертві" у січні 2016 і шукали нових організаторів; німецька група все
      ще згадувалася Kyiv Post у 2017. Учасники платять лише за свою їжу. Сесії тривають близько 2
      годин. Блог (оновлення 2016) каже, що російські та українські групи були "в принципі мертві"
      до січня 2016; німецька група для початківців усе ще працювала у вересні 2017 (Kyiv Post).
      Типовий вік учасників 20–28. Ціну 'free' виведено: учасники купують лише свою їжу. Оновлення
      блогу 2016 року каже, що російські та українські групи були "в принципі мертві". Дата
      публікації Kyiv Post (FRI) невідома. Ймовірно, також охоплено іншими дослідниками (європейські
      мови). Продовження: "Sunday conversation club" LEC у "Циферблаті" 2018–2021 та книжковий клуб
      LEC (2019–2024). Сайт мережі lec.link перелічує клуби англійської, німецької, французької,
      іспанської, італійської й української; багато з них є в цьому списку окремо.
    location.venue: Puzata Khata (більшість зустрічей)
  en:
    notes: >-
      Umbrella for many clubs. The blog's 2016 update says the Russian and Ukrainian clubs were
      'basically dead' in January 2016 and looking for new organizers; the German group was still
      listed by Kyiv Post in 2017. Attendees pay only for their own food. Sessions about 2 hours.
      Blog (2016 update) says the Russian and Ukrainian groups were 'basically dead' by Jan 2016;
      the German beginners group was still running in Sept 2017 (Kyiv Post). Typical attendee age
      20–28. Price 'free' is inferred: participants only buy their own food. 2016 blog update says
      Russian and Ukrainian groups were 'basically dead'. FRI Kyiv Post date unknown. Likely also
      covered by other researchers (European languages). Continued: "Sunday conversation club" LEC
      at Cyferblat 2018–2021 and the LEC book club (2019–2024). The network site lec.link lists
      English, German, French, Spanish, Italian and Ukrainian clubs; many of them are listed
      separately in this list.
    location.metro: Kontraktova Square
