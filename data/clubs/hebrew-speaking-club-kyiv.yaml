id: hebrew-speaking-club-kyiv
name: Hebrew Speaking Club "What's about to talk?!" / "А поговорить?!" (Kyiv)
description: >-
  Conversation club for Hebrew learners as a follow-up to ulpan study. Each meeting is a
  conversation on a topic set in advance, often about Jewish tradition and holidays; native-speaker
  guests are invited. Kyiv was the first city; branches later opened in Chernivtsi, Melitopol,
  Vinnytsia, Kropyvnytskyi, Lviv, Kharkiv.
languages:
  - he
levels:
  - any
format: hybrid
location:
  venue: Cafe KAFFA (season 5 opening, 2020-09-02); online on Zoom from March 2020
  lat: 50.465839
  lon: 30.520084
  geocoded: true
schedule_note: >-
  Seasons run from September; meetings in class/cafe, online since March 2020. Exact day and time
  not published in the sources found.
