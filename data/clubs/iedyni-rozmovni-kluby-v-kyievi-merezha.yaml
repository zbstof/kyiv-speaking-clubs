id: iedyni-rozmovni-kluby-v-kyievi-merezha
name:
  uk: «Єдині» — розмовні клуби в Києві (мережа)
  en: "\"Yedyni\" — conversation clubs in Kyiv (network)"
description:
  uk: >-
    Загальний запис про рух «Єдині»: безкоштовні 28-денні онлайн-курси для переходу на українську та
    офлайн-розмовні клуби. Мовний омбудсман у своєму переліку (July 2022) навів 10 київських локацій
    клубу «Єдині» від ГО «Навчай українською». Серед партнерів були Департамент молоді та спорту
    Києва й центр підтримки «Я – Маріуполь».
  en: >-
    Umbrella record for the "Yedyni" movement: free 28-day online courses for switching to Ukrainian
    plus offline conversation clubs. In July 2022 the language ombudsman listed 10 Kyiv locations of
    the "Yedyni" club run by the NGO "Navchai ukrainskoiu". Partners included the Kyiv Department of
    Youth and Sport and the support centre "Ya – Mariupol".
languages:
  - uk
levels:
  - any
format: hybrid
price:
  free: true
registration: required
