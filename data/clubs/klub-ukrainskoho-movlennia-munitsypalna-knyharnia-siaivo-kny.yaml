id: klub-ukrainskoho-movlennia-munitsypalna-knyharnia-siaivo-kny
name:
  uk: Клуб українського мовлення (муніципальна книгарня «Сяйво книги»)
  en: Ukrainian speaking club ("Siaivo knyhy" municipal bookshop)
description:
  uk: >-
    Безкоштовний розмовний клуб української мови в муніципальній книгарні; перша зустріч зібрала
    майже 200 людей; після анкетування учасників розподілили на групи. Веде Світлана Лукач, докторка
    філософії в галузі педагогіки.
  en: >-
    Free Ukrainian conversation club at the municipal bookshop; first meeting gathered almost 200
    people; participants split into groups after a questionnaire. Led by Svitlana Lukach, PhD in
    pedagogy.
