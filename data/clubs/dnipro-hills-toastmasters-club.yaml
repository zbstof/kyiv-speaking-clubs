notes:
  uk: >-
    Офіційно зареєстровано 2002-08 (Meetup: дата заснування — August 2002). Meetup: 1,193 учасники,
    387 минулих подій, майбутні зустрічі щонеділі Nov 15 – Dec 6 2026. Також у переліку спільнот
    Kyiv Post від 2010-04-08. 1193 учасники Meetup. Майбутні події вказані до неділі Dec 6 (2026). У
    2023 — онлайн/гібрид/наживо у Vrebro.
  en: >-
    Chartered 2002-08 (Meetup: founded August 2002). Meetup: 1,193 members, 387 past events,
    upcoming Sundays Nov 15 – Dec 6 2026. Also in Kyiv Post community listings 2010-04-08. 1193
    Meetup members. Upcoming events listed to Sun Dec 6 (2026). In 2023 — online/hybrid/in person at
    Vrebro.
