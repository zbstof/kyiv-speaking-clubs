    en: M. V. Hohol Library
  address:
    uk: вул. Велика Васильківська, 136
    en: 136 Velyka Vasylkivska St
  metro:
    uk: Либідська
    en: Lybidska
  lat: 50.413825
  lon: 30.523068
  geocoded: true
schedule:
  - day: fri
    frequency: weekly
    format: offline
schedule_note:
  uk: >-
    Клуб «Спілкуймося українською» щоп'ятниці в бібліотеці, веде поет Юрій Баланчук. Час у дописах
    не вказано, уточнюйте за телефоном (044) 529-14-73. Субота в бібліотеці вихідний. Остання
    зустріч у блозі — вівторок 4 серпня 2026.
  en: >-
    The "Spilkuimosia ukrainskoiu" club meets every Friday at the library, led by poet Yurii
    Balanchuk. Meeting times are not given in the posts; call (044) 529-14-73 to confirm. The
    library is closed on Saturdays. The latest meeting listed on the blog is Tuesday, 4 August 2026.
