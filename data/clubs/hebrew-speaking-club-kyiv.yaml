notes:
  uk: >-
    На сторінці програми ВААД зазначено, що клуб «продовжить роботу у 2022»; пізніших підтверджень
    не знайдено. Методичні рекомендації затверджені Таврійським національним університетом імені В.
    І. Вернадського 2019-08-28. У звіті ZFU за 2018 також вказано Skype HebrewKlubua та номер
    телефону (не скопійовано).
  en: >-
    The Vaad program page says the club 'will continue its work in 2022'; no later evidence found.
    Methodological guidelines approved by Taurida National V.I. Vernadsky University on 2019-08-28.
    ZFU 2018 report also lists Skype HebrewKlubua and a phone number (not copied).
