id: blabla-english-ua
name:
  uk: BlaBla English UA
  en: BlaBla English UA
description:
  uk: >-
    Безкоштовний онлайн-клуб англійської, який ведуть волонтери: три зустрічі в Zoom щотижня. Камери
    ввімкнені, говорять усі. Канал також анонсує офлайн-зустрічі Poznіaky English Speaking Club.
  en: >-
    A free volunteer-led online English club: three Zoom meetings each week. Cameras on, everyone
    speaks. The channel also announces in-person meetings of Pozniaky English Speaking Club.
