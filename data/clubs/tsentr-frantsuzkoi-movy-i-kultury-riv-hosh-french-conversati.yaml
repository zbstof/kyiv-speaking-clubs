notes:
  uk: >-
    Зазначений лише як пункт «Розмовний клуб» у картці школи в каталозі osvita.ua (картку оновлено
    26.05.2013). Розклад і формат не вказані. Телефон у картці: (044) 361-37-69. В іншій картці
    (https://osvita.ua/languages/courses/36764/, оновлено 25.05.2017) також зазначено клуб; поблизу
    метро «Театральна»; індивідуальні заняття з носієм мови — 150 грн/год.
  en: >-
    Listed only as a course item, "Conversation club", in the school's osvita.ua catalog entry
    (entry updated 26.05.2013). No schedule or format given. Phone in the entry: (044) 361-37-69. A
    second entry (https://osvita.ua/languages/courses/36764/, updated 25.05.2017) also lists the
    club; near Teatralna metro station; individual lessons with a native speaker cost 150 UAH/hour.
