    description: >-
      Білоруський мовний розмовний клуб у Києві; досліджувався в академічній статті 2019 року як
      модель організації розмовних клубів; Hromadske Radio висвітлювало його у 2017 році як місце,
      де можна побачити подібності та відмінності між білорусами й українцями.
    schedule_note: Що другий вівторок
    notes: >-
      Стаття: Staravojtava & Teadarovich, "Беларуская мова як замежная" 2/2018. Також цитовано:
      матеріал Hromadske Radio 2017-05-04 "Клуб білоруської мови в Києві". Статтю написали Nadzieja
      Staravojtava і Artsyom Teadarovich (IJBG, опубліковано 2019-02-15). Сторінка Hromadske Radio
      (2017) тепер повертає 404. Автори статті: Nadzieja Staravojtava, Artsyom Teadarovich
      (International Journal of Belarusian Studies, vol. 2, 2018, опубліковано 2019-02-15). Дати —
      це дата публікації, а не дати діяльності клубу.
    location.venue: >-
      Антикафе поруч із Києво-Могилянською академією (перший рік: Центр білоруської мови та
      культури, Інститут філології, KNU)
  en:
    name: Belarusian Speaking Club in Kyiv (Belaruski razmovny klub, BRK)
    notes: >-
      Article: Staravojtava & Teadarovich, "Belarusian as a Foreign Language" 2/2018. Also cited:
      Hromadske Radio piece 2017-05-04 "Belarusian language club in Kyiv". Article by Nadzieja
