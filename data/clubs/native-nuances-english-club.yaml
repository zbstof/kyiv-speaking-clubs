notes:
  uk: >-
    Щоб зареєструватися, напишіть «+» у відповідь у чаті. У попередньому перегляді Telegram роки не
    відображаються; їх визначено за днями тижня: дати за червень–липень і листопад відповідають 2025
    року, а за квітень–червень (сб 18 квітня … сб 6 червня) — 2026 року. У датах дописів зазначено
    лише день тижня й число; «неділя 24 травня» та «субота 06 червня» відповідають 2026 року (не
    перевірено).
  en: >-
    Register by replying '+' in the chat. Telegram preview shows no years; years inferred from
    weekdays: Jun–Jul and Nov dates match 2025, Apr–Jun dates (Sat 18 Apr … Sat 6 Jun) match 2026.
    Post dates show only weekday+day; 'Sunday 24 May' and 'Saturday 06 June' fit 2026 (not
    verified).
