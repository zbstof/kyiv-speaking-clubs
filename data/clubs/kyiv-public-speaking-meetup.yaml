id: kyiv-public-speaking-meetup
name:
  uk: Kyiv Public Speaking Meetup
  en: Kyiv Public Speaking Meetup
description:
  uk: >-
    Безкоштовні тренінги з публічних виступів («антилекції») англійською або українською для тих,
    хто вивчає мови й хоче подолати страх сцени.
  en: >-
    Free public-speaking trainings ('anti-lectures') in English or Ukrainian for language learners
    who want to beat stage fright.
languages:
  - en
  - uk
format: offline
