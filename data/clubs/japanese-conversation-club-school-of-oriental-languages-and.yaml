id: japanese-conversation-club-school-of-oriental-languages-and
name:
  uk: Розмовний клуб японської мови, Школа східних мов та культури (ШСМК)
  en: >-
    Japanese conversation club, School of Oriental Languages and Culture (Shkola skhidnykh mov ta
    kultury, ShSMK)
description:
  uk: >-
    Приватна школа, де викладають 8 східних мов (японську, китайську, корейську, арабську, турецьку,
    фарсі, гінді, індонезійську). У переліку є розмовний клуб японської мови; на сайті школи також
    згадуються розмовні клуби та майстер-класи загалом.
  en: >-
    Private school teaching 8 Eastern languages (Japanese, Chinese, Korean, Arabic, Turkish, Farsi,
    Hindi, Indonesian). Lists a Japanese conversation club; the school site also mentions speaking
    clubs and master classes in general.
