notes:
  uk: >-
    За даними Kyiv Post (2017-09-29), клуб проводить зустрічі щонайменше з 1997 року; група у
    Facebook (нині має назву «Deutscher Mittwochs-Stammtisch Kyjiw», відкрита, 608 учасників на
    момент перевірки 2026-11) у 2017 році налічувала понад 200 учасників; на кожну зустріч приходить
    близько 15 людей. Існує Telegram-акаунт @stammtisch_kyiv, але його зв’язок із цією групою не
    підтверджено. Рівні володіння мовою визначено приблизно на основі вимоги «потрібно розуміти
    розмови». Зустрічі задокументовані щонайменше з 1997 року. Попереднє місце зустрічей: ресторан
    Muka на Хрещатику (закрився восени 2016 року). 200+ учасників групи у Facebook, ~15 на кожній
    зустрічі.
  en: >-
    Kyiv Post (2017-09-29) says the club has met since at least 1997; Facebook group (now named
    'Deutscher Mittwochs-Stammtisch Kyjiw', public, 608 members when fetched 2026-11) had over 200
    members in 2017; about 15 people per meeting. A Telegram handle @stammtisch_kyiv exists but its
    link to this group is not verified. Levels are a guess from 'must follow conversations'.
    Meetings documented since at least 1997. Earlier venue: Muka restaurant on Khreshchatyk (closed
    fall 2016). 200+ FB group members, ~15 per meeting.
