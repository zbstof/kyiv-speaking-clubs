    description: >-
      Безкоштовний розмовний клуб української мови у публічній бібліотеці в Києві для людей, які
      переходять на українську або хочуть її вдосконалити.
    notes: >-
      Зазначено в обох списках бібліотек Київського управління культури (2023-08-17 і 2025-12-01). У
      списках не вказано часу зустрічей. Район визначено за адресою, не перевірено. Для дітей і
      дорослих. Організаторка й модераторка: Ольга Максименко (соціологиня, Інститут соціології
      НАНУ), згідно з її доповіддю на конференції у вересні 2023 року; кожне заняття має
      опублікований план уроку; теми включають історію кримських татар. Також проводить практикум
      «Наша мова — українська».
