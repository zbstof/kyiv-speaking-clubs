    en: Puzata Khata (most meetings)
  metro:
    uk: Контрактова площа
    en: Kontraktova Ploshcha
  lat: 50.43742
  lon: 30.515754
  geocoded: true
schedule_note:
  uk: >-
    Близько 2 годин на зустріч; у дописі ФРІ Київ зазначено, що зустрічі відбуваються щодня, мова
    щоразу інша.
  en: About 2 hours per meeting; FRI Kyiv post says meetings happen daily, language varies.
