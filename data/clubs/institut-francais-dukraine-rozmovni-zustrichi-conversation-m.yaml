id: institut-francais-dukraine-rozmovni-zustrichi-conversation-m
name:
  uk: "Institut français d'Ukraine: розмовні зустрічі"
  en: "Institut français d'Ukraine: Conversation meetings"
description:
  uk: >-
    Щотижневі розмовні зустрічі французькою в медіатеці IFU під керівництвом викладачів — носіїв
    мови, для слухачів курсів і читачів бібліотеки: новини, суспільство, кіно, музика, повсякденне
    життя.
  en: >-
    Weekly French conversation meetings at the IFU médiathèque, led by native-speaking teachers, for
    course students and library readers: news, society, cinema, music, everyday life.
languages:
  - fr
