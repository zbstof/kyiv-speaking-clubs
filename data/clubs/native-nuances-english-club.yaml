id: native-nuances-english-club
name:
  uk: Native Nuances English Club
  en: Native Nuances English Club
description:
  uk: >-
    Модерований розмовний клуб англійської в кав’ярні, який веде тренер з англійської — носій мови;
    усі по черзі відповідають на запитання за темою дня.
  en: >-
    Moderated English speaking club in a coffee shop, led by a native-speaker English coach;
    everyone answers questions on the topic of the day in turn.
languages:
  - en
levels:
  - B1
  - B2
  - C1
format: offline
