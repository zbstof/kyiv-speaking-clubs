schedule_note: >-
  «Спілкуймося українською»: every Friday (posts 31 Oct 2025 - 5 Jun 2026), led by poet Yurii
  Balanchuk. Earlier: «Єдині» Ukrainian conversation classes led by Olena Rubanets (Nov 2023);
  Ukrainian humour conversation club (Sep 2023); 2023 list name «Все буде Україна!».
