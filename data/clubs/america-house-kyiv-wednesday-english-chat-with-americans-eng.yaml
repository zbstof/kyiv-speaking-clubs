notes:
  uk: >-
    Реєстрація через Google Форму, на вході потрібен документ, що посвідчує особу. Назви в різні
    періоди: «Wednesday English @America House» (WE@AH, 2016–2018), «Conversation Club» (2022–spring
    2023), «Wednesday English: Chat with Americans» (2023–2024), «Wednesday English with Charlie»
    (2024–2026). Зафіксовано щотижневі зустрічі протягом Sep–Nov 2026. AHK також проводив American
    Lit Club, American Studies Club і книжковий клуб «Between the Lines», а 2016-05-28 організував
    захід розмовного клубу «найбільший урок англійської у світі». У лютому 2025 America House у
    Києві закрився, і зустрічі наживо, зокрема розмовний клуб, припинилися; натомість виник клуб «In
    Conversation With». З вересня 2026 зустрічі щосереди знову проходять онлайн у Zoom.
  en: >-
    Registration via Google Form, ID needed at entry. Names over time: "Wednesday English @America
    House" (WE@AH, 2016–2018), "Conversation Club" (2022–spring 2023), "Wednesday English: Chat with
    Americans" (2023–2024), "Wednesday English with Charlie" (2024–2026). Sessions seen weekly
    Sep–Nov 2026. AHK also ran an American Lit Club, American Studies Club and "Between the Lines"
    book club, and hosted the 2016-05-28 "largest English lesson in the world" conversation-club
    event. In February 2025, America House in Kyiv closed, and in-person meetings, including the
    conversation club, stopped; the "In Conversation With" club emerged as a replacement. Since
    September 2026, Wednesday sessions have been held online via Zoom again.
