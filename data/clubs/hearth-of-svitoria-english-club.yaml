id: hearth-of-svitoria-english-club
name:
  uk: Off the Page | Спілкування англійською в Києві
  en: Off the Page | English Conversation in Kyiv
description:
  uk: >-
    Безкоштовний англомовний клуб: розмови, фільми, прогулянки, без уроків і тестів. Клуб заснував
    іноземний волонтер, який понад два роки живе в Києві, щоб познайомити міжнародних волонтерів із
    молодими українцями.
  en: >-
    A free English-speaking club: conversations, films, walks, no lessons or tests. A foreign
    volunteer who has lived in Kyiv for over two years started it to bring international volunteers
    and young Ukrainians together.
