notes:
  uk: >-
    Розклад перевірено за дописами в Telegram-каналі за 7 тижнів (22.09–10.11.2026): онлайн
    щосереди, щоп’ятниці та щонеділі. Канал також анонсує вівторкові офлайн-зустрічі Poznіaky
    English Speaking Club. За даними Idealist, понад 250 онлайн-зустрічей, 15–35 учасників на
    зустрічі. Перша онлайн-зустріч — листопад 2023 (допис каналу «три роки» від 07.11.2026).
  en: >-
    Schedule verified against 7 weeks of Telegram channel posts (22.09–10.11.2026): online every
    Wed, Fri and Sun. The channel also announces Tuesday in-person meetings of Pozniaky English
    Speaking Club. According to Idealist, over 250 online meetings, with 15–35 participants per
    meeting. First online meeting: November 2023 (the channel’s "three years" post dated
    07.11.2026).
