id: molodizhna-biblioteka-spilkuimosia-ukrainskoiu-vpevneno-kurs
name:
  uk: >-
    Молодіжна бібліотека: «Спілкуймося українською впевнено!», курс «Яке прекрасне рідне слово»,
    клуб «Єдині»
  en: >-
    Youth Library: "Spilkuimosia ukrainskoiu vpevneno!", the "Yake prekrasne ridne slovo" course,
    the "Yedyni" club
description:
  uk: >-
    Безкоштовний розмовний клуб української мови в публічній бібліотеці Києва для тих, хто
    переходить на українську або вдосконалює її.
  en: >-
    Free Ukrainian conversation club at a Kyiv public library, for people switching to Ukrainian or
    improving it.
