  - en
levels:
  - A2
  - B1
  - B2
  - C1
format: offline
location:
  venue: Паб «Пивна Дума»
  address: вул. Михайла Драгоманова, 31г
  metro: Позняки
  note: 2 поверх
  lat: 50.401182
  lon: 30.639255
  geocoded: true
schedule:
  - day: tue
    time: "19:00"
    duration_min: 180
    frequency: weekly
    format: offline
schedule_note: Щовівторка 19:00–22:00. Ведучий бронює стіл; у групі пишуть, за яким столом.
price:
  free: true
registration: optional
contacts:
  - type: telegram
    access: on_request
    note: Закрита група; запрошення у ведучого
