notes:
  uk: >-
    Зазначено в обох переліках бібліотек Департаменту культури Києва (2023-08-17 та 2025-12-01). У
    переліках немає часу зустрічей. Район визначено за адресою, не перевірено. Курси «Мова вільних
    людей» проходять у партнерстві з благодійним фондом «Рокада». 2023: розмовний курс «Єдині» в цій
    бібліотеці.
  en: >-
    Listed in both Kyiv culture-department library lists (2023-08-17 and 2025-12-01). The lists give
    no meeting times. District inferred from the address, not verified. Courses "Mova vilnykh
    liudei" run in partnership with charity foundation "Rokada". 2023: a "Yedyni" conversation
    course at this library.
