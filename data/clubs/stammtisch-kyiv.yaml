notes: >-
  Kyiv Post (2017-09-29) says the club has met since at least 1997; Facebook group (now named
  'Deutscher Mittwochs-Stammtisch Kyjiw', public, 608 members when fetched 2026-11) had over 200
  members in 2017; about 15 people per meeting. A Telegram handle @stammtisch_kyiv exists but its
  link to this group is not verified. Levels are a guess from 'must follow conversations'. Meetings
  documented since at least 1997. Earlier venue: Muka restaurant on Khreshchatyk (closed fall 2016).
  200+ FB group members, ~15 per meeting.
