notes:
  uk: >-
    Є в обох переліках бібліотек Департаменту культури Києва (2023-08-17 і 2025-12-01). Час
    зустрічей у переліках не вказано. Район визначено за адресою, не перевірено. Назва у 2023 році:
    «Розмовний клуб «Все буде Україна!»».
  en: >-
    Listed in both Kyiv culture-department library lists (2023-08-17 and 2025-12-01). The lists give
    no meeting times. District inferred from the address, not verified. 2023 name: "Conversation
    club "Vse bude Ukraina!"".
