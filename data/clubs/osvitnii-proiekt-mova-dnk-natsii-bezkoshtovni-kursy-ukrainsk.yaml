id: osvitnii-proiekt-mova-dnk-natsii-bezkoshtovni-kursy-ukrainsk
name:
  uk: Освітній проєкт «Мова — ДНК нації» (безкоштовні курси української мови, Київ)
  en: Educational project "Mova — DNK natsii" (free Ukrainian language courses, Kyiv)
description:
  uk: >-
    Безкоштовні курси української мови в Києві та онлайн; за статтею 2020 року, навчання тривало 5-6
    місяців, заняття відбувалися раз на тиждень по 2 години, а проєкт називали першим таким в
    Україні.
  en: >-
    Free Ukrainian language courses in Kyiv and online; per a 2020 article, training lasted 5-6
    months, once a week for 2 hours, and was described as the first such project in Ukraine.
languages:
  - uk
levels:
  - any
format: hybrid
schedule_note:
  uk: Раз на тиждень, 2 години, 5-6 місяців (станом на Feb 2020).
  en: Once a week, 2 hours, 5-6 months (as of Feb 2020).
price:
  kind: free
organizer: Освітній проєкт «Мова — ДНК нації»
status: unknown
first_seen: "2020-02-25"
last_seen: "2020-02-25"
sources:
  - >-
    https://gazeta.ua/articles/chistota-movlennya/_de-bezkoshtovno-mozhna-pidtyagnuti-ukrayinsku/952958
notes:
  uk: >-
    Це радше курс, ніж клуб; подробиці взято з уривка в результатах пошуку, сторінка gazeta.ua
    повертала помилку 403. У списку міських бібліотек за Dec 2025 є розмовний клуб «Мова. ДНК нації»
    в бібліотеці ім. І. Шамо (вул. Героїв Севастополя, 22); зв’язок між ними не підтверджено.
  en: >-
    A course rather than a club; details from a search snippet, the gazeta.ua page returned 403. The
    Dec 2025 city library list has a speaking club, "Mova. DNK natsii", at the I. Shamo Library (22
    Heroiv Sevastopolia St); a link between the two is not verified.
