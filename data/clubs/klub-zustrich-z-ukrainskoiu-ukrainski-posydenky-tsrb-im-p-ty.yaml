id: klub-zustrich-z-ukrainskoiu-ukrainski-posydenky-tsrb-im-p-ty
name:
  uk: Клуб «Зустріч з українською» / «Українські посиденьки» (ЦРБ ім. П. Тичини)
  en: "\"Zustrich z ukrainskoiu\" / \"Ukrainski posydenky\" club (P. Tychyna Central District Library)"
description:
  uk: >-
    Безкоштовний розмовний клуб української мови в публічній бібліотеці Києва для тих, хто
    переходить на українську або вдосконалює її.
  en: >-
    Free Ukrainian conversation club at a Kyiv public library, for people switching to Ukrainian or
    improving it.
