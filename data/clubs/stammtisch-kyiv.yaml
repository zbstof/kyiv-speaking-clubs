id: stammtisch-kyiv
name:
  uk: Stammtisch (німецькомовний клуб, Дім Бергоньє)
  en: Stammtisch (German-speaking club, Dom Bergonie)
description:
  uk: >-
    Щотижневі безкоштовні німецькомовні зустрічі українців і німців: обговорення новин, обмін
    знаннями. Учасники мають розуміти розмову німецькою, вільне володіння мовою не обов’язкове.
  en: >-
    Weekly free German-language meetup of Ukrainians and Germans: news talk, knowledge sharing.
    Members need to follow a German conversation, fluency not required.
