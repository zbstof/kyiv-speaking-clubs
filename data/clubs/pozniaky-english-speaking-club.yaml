notes: >-
  Відновив роботу в травні 2023: вівторок 19:00–22:00, Пузата Хата в ТРЦ «Піраміда» (Мишуги, 4). У
  довіднику LEC раніше — понеділок і четвер там само. З вересня 2026 з безпекових причин — паб
  «Пивна Дума», 2 поверх. За словами організаторів (03.11.2026), клуб існує 15 років; Telegram-група
  — з травня 2023. Telegram-група клубу, прочитано 10.11.2026.
