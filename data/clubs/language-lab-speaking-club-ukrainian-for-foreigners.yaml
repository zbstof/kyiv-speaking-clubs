    url: https://lngglab.com/speaking-club
  - type: email
    url: info@languagelab.ua
  - type: website
    url: https://lngglab.com/
organizer: Language Lab (founder Ksenia Golubytska)
status: active
last_seen: "2026-08-23"
sources:
  - https://www.kyivpost.com/post/82766
