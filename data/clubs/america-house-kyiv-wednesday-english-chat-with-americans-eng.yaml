id: america-house-kyiv-wednesday-english-chat-with-americans-eng
name: America House Kyiv — Wednesday English (Chat with Americans / English with Charlie)
description: >-
  Weekly free English speaking club at America House Kyiv: practise English with Americans and the
  AHK team, discuss American life. Led in 2024–2025 by English Language Resident Charlie.
languages:
  - en
format: online
location:
  venue: Zoom (організатор — America House Kyiv)
schedule:
  - day: wed
    time: "19:00"
    duration_min: 90
    frequency: weekly
    format: online
schedule_note: >-
  Щосереди 19:00–20:30, онлайн у Zoom. Реєстрація через форму на сторінці події до 12:00 того ж дня,
  посилання на Zoom приходить на пошту в день зустрічі. Ведучий — Charlie, з 11.11.2026 — Patrice.
