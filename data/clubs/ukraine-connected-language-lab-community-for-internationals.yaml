id: ukraine-connected-language-lab-community-for-internationals
name:
  uk: Ukraine Connected (спільнота Language Lab для іноземців)
  en: Ukraine Connected (Language Lab community for internationals)
description:
  uk: >-
    Спільнота для іноземців та українців, яку київська школа Language Lab започаткувала до свого
    10-річчя; заходи наживо в Києві (під час повітряних тривог їх переносять в укриття або онлайн).
  en: >-
    Community for foreigners and Ukrainians launched by the Kyiv school Language Lab at its 10th
    anniversary; events in person in Kyiv (moved to shelters or online during air-raid alerts).
languages:
  - uk
  - en
levels:
  - any
format: hybrid
schedule_note:
  uk: >-
    Розкладу немає. Це спільнота, а не розмовний клуб: чати за темами, невеликі зустрічі, велика
    зустріч щонайменше раз на пів року. Вступ через форму, учасників відбирають координатори.
  en: >-
    There is no schedule. This is a community, not a speaking club: topic-based chats, small
    meetups, and a large gathering at least once every six months. Join via a form; coordinators
    select participants.
contacts:
  - type: other
    url: https://forms.gle/nM3NYdPBrCLcGZTB8
  - type: website
    url: https://lngglab.com/
organizer: Language Lab (founder Ksenia Golubytska)
status: active
first_seen: "2026-09-23"
last_seen: "2026-10-18"
sources:
  - https://www.kyivpost.com/post/87435
  - https://www.kyivpost.com/topic/language-lab
  - https://www.kyivpost.com/post/85262
notes:
  uk: >-
    Спільнота, а не суто розмовний клуб; започаткована на ювілейному заході приблизно 3 Oct 2026.
    Партнерський матеріал Kyiv Post.
  en: >-
    A community, not strictly a speaking club; launched at the anniversary event about 3 Oct 2026.
    Kyiv Post partnership content.
