id: pozniaky-english-speaking-club
name: Poznіaky English Speaking Club
description: >-
  Офлайн-клуб англійської на Позняках. Зустрічі анонсує також онлайн-клуб BlaBla English UA, де
  ведучий Вадим теж волонтер.
