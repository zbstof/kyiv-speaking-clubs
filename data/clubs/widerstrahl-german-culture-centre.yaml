notes: >-
  Website (checked 2026-11) lists 'клуб розмовної практики для дітей, підлітків, дорослих'; latest
  site news 2026-10-23. No club schedule on site. Second osvita card (updated 2013-08-21,
  https://osvita.ua/languages/courses/8863/) lists: conversation club for children, discussion club
  for adults by level, video clubs, guide-interpreter club. The centre now trades as Deutsches
  Haus-Kyjiw (education.ua card updated 2026-08-26 lists courses, no club). Phone is the centre's
  public office line.
