notes:
  uk: >-
    Публічна Telegram-група, понад 500 учасників. Активність: 30–50 повідомлень на місяць улітку
    2026, 5–11 з жовтня. Найактивніший у 2022 році (~2700 повідомлень), далі щороку менше. Клуб
    мережі LEC (Wednesday і Friday English@Obolon).
  en: >-
