id: iedyni-rozmovni-kluby-v-kyievi-merezha
name: «Єдині» — розмовні клуби в Києві (мережа)
description: >-
  Umbrella record for the «Єдині» movement: free 28-day online courses for switching to Ukrainian
  plus offline conversation clubs. In July 2022 the language ombudsman listed 10 Kyiv locations of
  the «Єдині» club of ГО «Навчай українською». Partners included the Kyiv Department of Youth and
  Sport and the support centre «Я – Маріуполь».
languages:
  - uk
levels:
  - any
format: hybrid
price:
  free: true
registration: required
