id: rozmovnyi-klub-mova-dnk-natsii-ta-kursy-mova-vilnykh-liudei
name: Розмовний клуб «Мова. ДНК нації» та курси «Мова вільних людей» (бібліотека ім. І. Шамо)
description: >-
  Free Ukrainian conversation club at a Kyiv public library, for people switching to Ukrainian or
  improving it.
