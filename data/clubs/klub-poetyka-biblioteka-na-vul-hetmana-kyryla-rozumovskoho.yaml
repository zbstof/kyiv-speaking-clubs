id: klub-poetyka-biblioteka-na-vul-hetmana-kyryla-rozumovskoho
name: Клуб «Поетика» (бібліотека на вул. Гетьмана Кирила Розумовського)
description: >-
  Free Ukrainian conversation club at a Kyiv public library, for people switching to Ukrainian or
  improving it.
