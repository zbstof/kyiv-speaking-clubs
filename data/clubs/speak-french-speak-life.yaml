id: speak-french-speak-life
name:
  uk: Speak french, speak life
  en: Speak french, speak life
description:
  uk: >-
    Франкомовний розмовний клуб: зустрічі в кафе, часто з темою вечора (вдячність, правда,
    рівновага). Приходять франкомовні іноземці, які живуть у Києві, і ті, хто вчить мову.
  en: >-
    A French conversation club: meetings in a café, often with a topic of the evening (gratitude,
    truth, balance). French speakers living in Kyiv come along with learners.
languages:
  - fr
format: offline
location:
  venue:
    uk: Кав'ярня Turka
    en: Turka café
  address:
    uk: вул. Шота Руставелі, 19
    en: 19 Shota Rustaveli St
  note:
    uk: >-
      Іноді зустрічаються в іншому місці, наприклад у ресторані RUMI (Бессарабська пл., 9). Адреса —
      в анонсі в групі.
    en: >-
      Sometimes the meeting is elsewhere, for example at RUMI restaurant (9 Bessarabska Sq). The
      address is in the group's announcement.
  lat: 50.438273
  lon: 30.519754
  geocoded: true
