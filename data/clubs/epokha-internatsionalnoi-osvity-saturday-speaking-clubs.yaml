  en: Epokha Internatsionalnoi Osvity Saturday speaking clubs
description:
  uk: >-
    Суботні розмовні клуби з українськими викладачами та носіями мови: німецька, французька,
    італійська, англійська та російська/українська для іноземців. Заняття тривають 2 години.
  en: >-
    Saturday conversation clubs led by Ukrainian teachers and native speakers in German, French,
    Italian, English, and Russian/Ukrainian for foreigners. 2-hour sessions.
