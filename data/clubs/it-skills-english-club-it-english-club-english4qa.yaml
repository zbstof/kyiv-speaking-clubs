notes:
  uk: >-
    Десятки оголошень на DOU за 2016–2018 роки (архівні сторінки 26–37 за тегом «English»).
    Об’єднані в один клуб за спільним номером телефону; захід «English Club: sysadmin, devops,
    developer» від 2018-07-29 (адресу надсилають після реєстрації) зараховано до нього лише за
    стилем оголошення (не перевірено).
  en: >-
    Dozens of DOU listings 2016–2018 (archive pages 26–37 of tag 'English'). Grouped as one club by
    the shared phone number; the 2018-07-29 'English Club: sysadmin, devops, developer' (address
    sent after registration) is attributed to it by style only (not verified).
