format: online
schedule_note:
  uk: >-
    Онлайн у Zoom, кілька сесій щодня, запис обов'язковий на langclub.live/sessions (RSVP на Meetup
    не рахується). За київським часом 10–16.11.2026: щодня о 15:00, увечері о 19:00–21:00 і вночі о
    03:00, у вихідні ще о 14:00. Meetup-група не публікує подій з 19.09.2026.
  en: >-
    Online on Zoom, several sessions daily; registration at langclub.live/sessions is required (a
    Meetup RSVP does not count). Kyiv time, 10–16.11.2026: daily at 15:00, evenings at 19:00–21:00
    and overnight at 03:00, plus 14:00 on weekends. The Meetup group has not posted events since
    19.09.2026.
