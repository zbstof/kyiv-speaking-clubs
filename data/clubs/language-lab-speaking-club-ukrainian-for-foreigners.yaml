notes: >-
  Language Lab teaches Ukrainian to foreigners online and in person in Kyiv; started in 2016 as an
  English school. Regular club schedule not verified. Site: 'Speaking Clubs: online & in-person
  language practice for all levels'; school near Golden Gate. Free online Independence Day edition
  Sun 2026-08-23 19:00 (Zoom). Kyiv Post 'More on Language Lab' dated 2026-08-20.
i18n:
  en:
    location.address: 11 Yaroslaviv Val St
    schedule_note: >-
      There is no regular schedule; club sessions are announced individually. The latest meeting was
      on 23.08.2026, Sunday, at 19:00 on Zoom (for Independence Day). Register via the form on the
