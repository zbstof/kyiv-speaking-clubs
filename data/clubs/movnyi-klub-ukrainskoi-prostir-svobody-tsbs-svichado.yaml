id: movnyi-klub-ukrainskoi-prostir-svobody-tsbs-svichado
name:
  uk: Мовний клуб української «Простір свободи» (ЦБС «Свічадо»)
  en: Ukrainian language club "Prostir svobody" ("Svichado" Centralized Library System)
description:
  uk: >-
    Безкоштовний розмовний клуб української мови в публічній бібліотеці Києва для тих, хто
    переходить на українську або вдосконалює її.
  en: >-
    Free Ukrainian conversation club at a Kyiv public library, for people switching to Ukrainian or
    improving it.
languages:
  - uk
format: offline
location:
  venue:
    uk: Центральна районна бібліотека ЦБС «Свічадо»
    en: Central District Library of the "Svichado" Centralized Library System
  address:
    uk: бульвар Жуля Верна, 13-в
    en: 13-V Zhulia Verna Blvd
  lat: 50.434222
  lon: 30.365432
  geocoded: true
price:
  free: true
organizer: Центральна районна бібліотека ЦБС «Свічадо»
status: unknown
first_seen: 2023-08
last_seen: "2025-12-01"
sources:
  - >-
    https://dk.kyivcity.gov.ua/news/perelik-rozmovnikh-klubiv-ta-kursiv-ukrainskoi-movi-v-bibliotekakh-kieva
  - >-
    https://kyivcity.gov.ua/oholoshennia/pro_robotu_rozmovnikh_klubiv_ta_kursiv_ukransko_movi_v_bibliotekakh_m_kiyeva/
