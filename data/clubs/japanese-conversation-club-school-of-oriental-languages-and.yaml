id: japanese-conversation-club-school-of-oriental-languages-and
name: >-
  Japanese conversation club, School of Oriental Languages and Culture (Школа східних мов та
  культури, ШСМК)
description: >-
  Private school teaching 8 Eastern languages (Japanese, Chinese, Korean, Arabic, Turkish, Farsi,
  Hindi, Indonesian). Lists a Japanese conversation club; the school site also mentions speaking
  clubs and master classes in general.
languages:
  - ja
format: hybrid
location:
  venue: Школа східних мов та культури
  address: бульв. Тараса Шевченка, 1-Б, офіс 12-А
  metro: Театральна / Площа Українських Героїв
  note: Вхід через арку
  lat: 50.441927
  lon: 30.519344
  geocoded: true
schedule_note: >-
  Розклад не опубліковано. Безкоштовний розмовний клуб з носієм мови входить у курс японської (для
  учнів школи). Деталі — в адміністратора: пн–пт 12:00–19:30, сб 10:00–17:30.
price:
  free: true
  amount: безкоштовно для учнів курсу
