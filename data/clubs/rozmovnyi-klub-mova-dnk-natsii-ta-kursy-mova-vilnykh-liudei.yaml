  venue:
    uk: Бібліотека сімейного читання ім. І. Шамо
    en: I. Shamo Family Reading Library
  address:
    uk: вул. Героїв Севастополя, 22
    en: 22 Heroiv Sevastopolia St
  lat: 50.440867
  lon: 30.416561
  geocoded: true
price:
  free: true
