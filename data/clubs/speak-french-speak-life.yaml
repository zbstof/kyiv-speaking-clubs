schedule_note:
  uk: >-
    Четвер 18:30–20:30 у 1-й, 2-й і 4-й тиждень місяця; у 3-й тиждень замість четверга — субота.
    День і місце іноді змінюються, тож дивіться анонс у групі.
  en: >-
    Thursday 18:30–20:30 in the 1st, 2nd and 4th weeks of the month; in the 3rd week, Saturday
    instead of Thursday. The day and venue sometimes change, so check the group's announcement.
