    description: >-
      Приватна школа, де викладають 8 східних мов (японську, китайську, корейську, арабську,
      турецьку, фарсі, гінді, індонезійську). У переліку є розмовний клуб японської мови; на сайті
      школи також згадуються розмовні клуби та майстер-класи загалом.
    notes: >-
