notes:
  uk: >-
    Згадано в чаті Speaking Event Club (Telegram), де учасники різних клубів діляться анонсами;
    прочитано 10.11.2026. Група «Conversation club (Kyiv)» має понад 1900 учасників, також анонсує
    клуби інших мов і онлайн. Історія: 2018–2024 — антикафе «Циферблат» (у 2023 також Fontaine на
    Арсенальній, пн–сб), 2020–2021 переважно онлайн, з 2025 — «Дирижабль»/Arcanum. У довіднику LEC —
    «English in Ziferblat», субота 15:00–17:00, вул. Володимирська, 49А.
  en: >-
    Mentioned in the Speaking Event Club chat (Telegram), where members of different clubs share
    announcements; read on 10.11.2026. The "Conversation club (Kyiv)" group has over 1900 members
    and also announces clubs for other languages and online clubs. History: 2018–2024 — "Ziferblat"
    anti-cafe (in 2023 also Fontaine at Arsenalna, Mon–Sat), 2020–2021 mostly online, since 2025 —
    "Dyryzhabl"/Arcanum. In the LEC directory — "English in Ziferblat", Saturday 15:00–17:00, 49A
    Volodymyrska St.
