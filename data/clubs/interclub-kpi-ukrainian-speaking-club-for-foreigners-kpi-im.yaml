id: interclub-kpi-ukrainian-speaking-club-for-foreigners-kpi-im
name:
  uk: Interclub KPI / Розмовний клуб української мови для іноземців (КПІ ім. Ігоря Сікорського)
  en: Interclub KPI / Ukrainian Speaking Club for foreigners (Igor Sikorsky KPI)
description:
  uk: >-
    Клуб підтримки іноземних студентів у КПІ ім. Ігоря Сікорського: щотижневі зустрічі для вивчення
    української мови та культури; Студентська соціальна служба КПІ описувала безкоштовні групові
    заняття для іноземців щочетверга як «розмовний клуб української мови».
  en: >-
    Student support club for foreign students at Igor Sikorsky Kyiv Polytechnic Institute: weekly
    meetings to learn about Ukrainian language and culture; the Students' Social Service of KPI
    described free group sessions for foreigners on Thursdays as a «Ukrainian Speaking Club».
