id: rozmovnyi-klub-ukrainska-iednaie-knu-im-t-shevchenka-kafedra
name: >-
  Розмовний клуб «Українська єднає» (КНУ ім. Т. Шевченка, кафедра української філології для
  іноземних громадян)
description: >-
  Online conversation club in Ukrainian for foreign students (A2-B1) of the KNU Institute of
  Philology; the documented session on 31 May 2023 joined 9 Chinese students of KNU and 4 University
  of Washington students on Zoom, using group work, Take Turns, improv games and Kahoot.
languages:
  - uk
levels:
  - A2
  - B1
format: online
location:
  venue: Online (Zoom); Навчально-науковий інститут філології КНУ
  address: бульвар Тараса Шевченка, 14 (institute building)
schedule_note: "Documented session: 31 May 2023, 06:00 Kyiv time. No regular schedule published."
price:
  free: true
organizer: >-
  Кафедра української філології для іноземних громадян, ННІ філології КНУ ім. Т. Шевченка
  (moderators O. Kasianova, S. Fedzhora)
status: unknown
first_seen: "2023-05-31"
last_seen: "2023-05-31"
sources:
  - https://ir.library.knu.ua/bitstreams/446b8b71-de7f-4232-8caf-e6bf56aee898/download
notes: >-
  Source: S. Derba, O. Kasianova, 'Тарас Шевченко: розмовний клуб української мови як іноземної',
  KNU journal 2026 no. 1(29). The paper says Ukrainian speaking clubs for foreigners are rare in
  Ukraine. Institute address is general knowledge, not from the source.
i18n:
  en:
    name: >-
      Conversation club "Ukrainian Unites" (Taras Shevchenko National University of Kyiv, Department
      of Ukrainian Philology for Foreign Citizens)
    location.venue: >-
      Online (Zoom); Educational and Scientific Institute of Philology, Taras Shevchenko National
      University of Kyiv
    notes: >-
      Source: S. Derba, O. Kasianova, "Taras Shevchenko: Ukrainian as a Foreign Language
      Conversation Club", KNU Journal 2026 no. 1(29). The paper states that Ukrainian conversation
      clubs for foreigners are rare in Ukraine. The institute address is general knowledge and is
      not taken from the source.
    location.address: 14 Taras Shevchenko Boulevard (institute building)
  uk:
    description: >-
      Онлайн-розмовний клуб українською для іноземних студентів (A2-B1) Інституту філології KNU; у
      задокументованій сесії 31 травня 2023 року в Zoom брали участь 9 китайських студентів KNU та 4
      студенти University of Washington; використовували групову роботу, Take Turns, імпровізаційні
      ігри та Kahoot.
    schedule_note: >-
      Задокументована сесія: 31 травня 2023, 06:00 київського часу. Регулярного розкладу не
      опубліковано.
    notes: >-
      Джерело: S. Derba, O. Kasianova, «Тарас Шевченко: розмовний клуб української мови як
      іноземної», журнал KNU, 2026 № 1(29). У статті зазначається, що розмовні клуби української
      мови для іноземців в Україні трапляються рідко. Адреса інституту є загальною інформацією і не
      наведена в цьому джерелі.
    location.address: бульвар Тараса Шевченка, 14 (будівля інституту)
