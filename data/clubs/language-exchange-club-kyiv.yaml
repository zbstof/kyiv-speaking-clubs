id: language-exchange-club-kyiv
name:
  uk: Language Exchange Club Kyiv
  en: Language Exchange Club Kyiv
description:
  uk: >-
    Безкоштовна мережа мовних груп, які зустрічаються в недорогих ресторанах; окремі групи для
    кожної мови (англійської, російської, української, німецької, французької та інших), близько 2
    годин на зустріч.
  en: >-
    Free network of language groups meeting in cheap restaurants; separate groups per language
    (English, Russian, Ukrainian, German, French and others), about 2 hours per meeting.
