notes:
  uk: >-
    Є в обох переліках бібліотек Департаменту культури Києва (2023-08-17 та 2025-12-01). Час
    зустрічей у переліках не зазначено. Район визначено за адресою, але не перевірено. Для дітей і
    дорослих. Організаторка й модераторка — Ольга Максименко (соціологиня, Інститут соціології НАН
    України), за її доповіддю на конференції (Sept 2023); для кожного заняття опубліковано план;
    серед тем — історія кримських татар. Також проводить практикум «Наша мова — українська».
  en: >-
    Listed in both Kyiv culture-department library lists (2023-08-17 and 2025-12-01). The lists give
    no meeting times. District inferred from the address, not verified. For children and adults.
    Organiser and moderator: Olha Maksymenko (sociologist, Institute of Sociology NASU), per her
    Sept 2023 conference paper; each session has a published lesson plan; topics include Crimean
    Tatar history. Also runs practicum "Nasha mova — ukrainska".
