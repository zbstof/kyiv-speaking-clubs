notes:
  uk: >-
    Є в переліку розмовних клубів і курсів української мови в міських бібліотеках від Департаменту
    культури Києва, опублікованому 2023-08-17 (50 позицій; КМДА повідомила про «50 клубів і курсів»
    2023-09-20). Час зустрічей у переліку не вказано. Район визначено за адресою, не перевірено. Є в
    міському переліку за 2023 рік; немає в бібліотечному переліку за Dec 2025 (який охоплює лише
    бібліотеки).
  en: >-
    Listed in the Kyiv culture department list of Ukrainian conversation clubs and courses in city
    libraries, published 2023-08-17 (50 entries; KMDA reported '50 clubs and courses' on
    2023-09-20). The list gives no meeting times. District inferred from the address, not verified.
    Listed in the 2023 city list; not in the Dec 2025 library list (which covers libraries only).
