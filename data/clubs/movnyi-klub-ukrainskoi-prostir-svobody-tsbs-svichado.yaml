  свободи».
i18n:
  en:
    location.address: 13-V Zhulia Verna Blvd
    name: Ukrainian language club "Prostir svobody" ("Svichado" Centralized Library System)
    notes: >-
      Listed in both Kyiv culture-department library lists (2023-08-17 and 2025-12-01). The lists
      give no meeting times. District inferred from the address, not verified. 2023: language club
      "Navchai ukrainsku" and a literary club with Olha Babchuk; 2025: literary club and language
      club "Prostir svobody".
    location.venue: Central District Library of the "Svichado" Centralized Library System
  uk:
    description: >-
      Безкоштовний розмовний клуб української мови в публічній бібліотеці Києва для тих, хто
      переходить на українську або вдосконалює її.
    notes: >-
      Є в обох бібліотечних переліках Департаменту культури Києва (2023-08-17 та 2025-12-01). У
      переліках не вказано часу зустрічей. Район визначено за адресою, але не перевірено. 2023:
      мовний клуб «Навчай українську» та літературний клуб з Ольгою Бабчук; 2025: літературний клуб
      і мовний клуб «Простір свободи».
