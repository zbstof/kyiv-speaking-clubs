notes:
  uk: >-
    Telegram-група клубу, прочитано 10.11.2026. На цьому місці із середини жовтня 2026, раніше місце
    змінювалося. Організатор 08.11.2026 вказав адресу: вул. Золотоворітська, 17 (раніше в анонсах —
    15). Улітку 2026 місце змінювалося, зокрема зустрічі проходили в Arcanum. Клуб почав працювати в
    лютому–березні 2025 як заміна розмовного клубу America House, коли той призупинив роботу; задум
    — спілкування українців і американців.
  en: >-
    Club Telegram group, read on 10.11.2026. At this location since mid-October 2026; previously,
    the venue changed. On 08.11.2026, the organizer gave the address as 17 Zolotovoritska St
    (previously 15 in announcements). In summer 2026, the venue changed, with meetings held at
    Arcanum among other places. The club started in February–March 2025 as a replacement for the
    America House speaking club when it suspended operations; the idea was to bring Ukrainians and
    Americans together for conversation.
