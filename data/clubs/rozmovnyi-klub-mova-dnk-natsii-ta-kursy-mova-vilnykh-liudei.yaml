  uk:
    description: >-
      Безкоштовний розмовний клуб української мови в київській публічній бібліотеці для людей, які
      переходять на українську або хочуть її вдосконалити.
    notes: >-
      Зазначено в обох списках бібліотек департаменту культури Києва (2023-08-17 і 2025-12-01). У
      списках не вказано часів зустрічей. Район визначено за адресою, не перевірено. Курси "Мова
      вільних людей" проводяться у партнерстві з благодійним фондом "Рокада". У 2023 році в цій
      бібліотеці відбувся розмовний курс "Єдині".
