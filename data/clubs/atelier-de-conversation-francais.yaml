    дивіться анонс у групі. Влітку 2026 зустрічі були по суботах о 18:00.
  en: >-
    Weekly at 18:30, mostly on Thursdays; the day sometimes changes (Friday on 20.11.2026), so check
    the group's announcement. In summer 2026 the meetings were on Saturdays at 18:00.
