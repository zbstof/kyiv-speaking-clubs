  uk:
    description: >-
      Неді́льна школа в Києві для дітей з вивчення кримськотатарської мови, історії й культури
      (студія «Фідан»); інтерактивні уроки та екскурсії. Найближча група для практики
      кримськотатарської мови в Києві; не є розмовним клубом для дорослих.
    schedule_note: Щонеділі; новий навчальний рік відкрився Oct 2019.
    notes: >-
      Кодовий позначник мови crh = кримськотатарська (ISO 639-3; немає коду ISO 639-1). Не знайдено
      розмовного клубу кримськотатарської мови для дорослих у Києві. Супутнє: NaUKMA пропонує
      кримськотатарську як вибірну дисципліну з 2025/26; KNU має програму кримськотатарської мови та
      літератури з 2014 року (курси, не клуби).
